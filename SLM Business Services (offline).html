        <div style=\"font-weight:600\">{{ r.durLabel }}<\u002Fdiv>\n                  <div>\n                    <div style=\"height:8px;border-radius:4px;background:#EEF0F5;overflow:hidden;position:relative\"><div style=\"{{ r.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#9AA0AE;margin-top:4px\">{{ r.windowLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ r.floatStyle }}\">{{ r.floatLabel }}<\u002Fdiv>\n                  <div><span style=\"{{ r.critChip }}\">{{ r.crit }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ dec.coverage }}\" as=\"c\" hint-placeholder-count=\"1\">\n              <div style=\"border:1px solid #F1DFBC;background:#FDF6E9;border-radius:12px;padding:20px 22px\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n                  <span style=\"width:10px;height:10px;border-radius:5px;background:#B45309;flex-shrink:0\"><\u002Fspan>\n                  <div style=\"font-size:15px;font-weight:700;color:#7C4A02;letter-spacing:-.01em\">Coverage feasibility risk<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;color:#6B4A15;line-height:1.7;max-width:760px\">{{ c.pre }}<strong>{{ c.calA }}<\u002Fstrong>{{ c.mid }}<strong>{{ c.calB }}<\u002Fstrong>{{ c.post }}<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;margin-top:16px;flex-wrap:wrap\">\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Raise remediation<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #E3C892;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#7C4A02;cursor:pointer;white-space:nowrap\">Record exception<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:20px 22px\">\n              <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px\">Critical path<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">{{ dec.pathNote }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                <sc-for list=\"{{ dec.path }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:center;gap:9px\">\n                    <div style=\"{{ p.arrowStyle }}\">→<\u002Fdiv>\n                    <div style=\"{{ p.style }}\">{{ p.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:14px\">Linked OLAs<\u002Fdiv>\n                <sc-if value=\"{{ ag.noOlas }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:16px 0;font-size:12.5px;color:#8A90A0;border-top:1px solid #F0F2F6\">No internal commitments underpin this agreement.<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ ag.olas }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F0F2F6\">\n                    <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:600\">{{ o.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0\">{{ o.meta }} · {{ o.crit }}<\u002Fdiv><\u002Fdiv>\n                    <span style=\"{{ o.chip }}\">{{ o.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap\">\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">+ Link OLA<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ goGraph }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">View dependency graph →<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:14px\">Underpinning contracts<\u002Fdiv>\n                <sc-if value=\"{{ ag.noUcs }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:16px 0;font-size:12.5px;color:#8A90A0;border-top:1px solid #F0F2F6\">No vendor contracts underpin this agreement.<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ ag.ucs }}\" as=\"u\" hint-placeholder-count=\"2\">\n                  <div style=\"padding:12px 0;border-top:1px solid #F0F2F6\">\n                    <div style=\"display:flex;align-items:center;gap:12px\">\n                      <div style=\"flex:1\"><div style=\"font-size:13px;font-weight:600\">{{ u.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0\">{{ u.meta }}<\u002Fdiv><\u002Fdiv>\n                      <span style=\"{{ u.chip }}\">{{ u.state }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#5F6368;margin-top:6px\">Engagement: {{ u.mode }} · Internal owner {{ u.owner }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap;margin-top:16px;display:inline-block\">+ Link contract<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ agGraphTab }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font-size:12.5px;color:#5F6368;margin-bottom:16px\">{{ graphNote }}<\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px;margin-bottom:16px\">\n              <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:12px\">Service target<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ decTargets }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><span>{{ t.label }}<\u002Fspan><span style=\"{{ t.badgeStyle }}\">{{ t.badge }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ graphIsXla }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px;max-width:820px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n                <span style=\"width:10px;height:10px;border-radius:5px;background:#5B3AA6\"><\u002Fspan>\n                <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">No dependency chain for an experience target<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#3D424E;line-height:1.6;max-width:640px\">{{ xla.graphNote }}<\u002Fdiv>\n              <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin:20px 0 10px\">Weighted drivers instead of predecessors<\u002Fdiv>\n              <sc-for list=\"{{ xla.driverRows }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #F0F2F6;flex-wrap:wrap\">\n                  <div style=\"flex:1;min-width:200px\"><div style=\"font-size:12.5px;font-weight:600\">{{ d.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ d.corr }} · contribution {{ d.contrib }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"width:120px\"><div style=\"height:7px;border-radius:4px;background:#EEF0F5;overflow:hidden\"><div style=\"{{ d.barStyle }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <div style=\"width:56px;text-align:right;font-size:12.5px;font-weight:700\">{{ d.weight }}<\u002Fdiv>\n                  <div style=\"{{ d.curStyle }};width:96px;text-align:right\">{{ d.cur }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:10px;margin-top:18px;flex-wrap:wrap\">\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">+ Add driver<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Open experience review<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ graphIsStd }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:20px 24px\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px\">\n                <sc-for list=\"{{ durStats }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div style=\"padding:12px 14px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\">\n                    <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A90A0\">{{ m.k }}<\u002Fdiv>\n                    <div style=\"{{ m.valStyle }}\">{{ m.v }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#8A90A0;margin-top:3px;line-height:1.4\">{{ m.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin:20px 0 8px\">Critical path against the target window<\u002Fdiv>\n              <div style=\"position:relative;height:34px;border-radius:6px;background:#F0F2F6;overflow:hidden\">\n                <div style=\"{{ durLeewayStyle }}\"><\u002Fdiv>\n                <sc-for list=\"{{ durSegs }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"{{ durTargetLine }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:30px;margin-top:4px;font-size:10.5px;color:#8A90A0\">\n                <span style=\"position:absolute;left:0;top:0\">T+0<\u002Fspan>\n                <span style=\"{{ durTargetLabel }}\">{{ durTargetText }}<\u002Fspan>\n                <span style=\"{{ durEndLabel }}\">{{ durEndText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:#5F6368\">\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:10px;border-radius:2px;background:#3A9A6E\"><\u002Fspan>OLA<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:10px;border-radius:2px;background:#7B5CC4\"><\u002Fspan>UC<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,#BFE3CF 0 4px,#E6F4EC 4px 8px)\"><\u002Fspan>Leeway before target<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,#F4B9B5 0 4px,#FDECEA 4px 8px)\"><\u002Fspan>Overrun past target<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:2px;height:12px;background:#17213C\"><\u002Fspan>Target due<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n              <div style=\"flex:1 1 600px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px;overflow-x:auto\">\n                <div style=\"{{ canvasStyle }}\">\n                  <svg sc-camel-view-box=\"{{ viewBox }}\" style=\"{{ svgStyle }}\">\n                    <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"4\">\n                      <line x1=\"{{ e.x1 }}\" y1=\"{{ e.y1 }}\" x2=\"{{ e.x2 }}\" y2=\"{{ e.y2 }}\" stroke=\"{{ e.stroke }}\" stroke-width=\"2\" stroke-dasharray=\"{{ e.dash }}\"><\u002Fline>\n                    <\u002Fsc-for>\n                  <\u002Fsvg>\n                  <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"5\">\n                    <div sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">\n                      <div style=\"{{ n.kindStyle }}\">{{ n.kind }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3\">{{ n.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#5F6368;margin-top:3px\">{{ n.target }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#8A90A0;margin-top:2px\">{{ n.float }}<\u002Fdiv>\n                      <div style=\"{{ n.stateStyle }}\">{{ n.state }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:20px;justify-content:center;margin-top:18px;font-size:11.5px;color:#8A90A0;flex-wrap:wrap\">\n                  <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:20px;height:2px;background:#17213C\"><\u002Fspan>critical path<\u002Fspan>\n                  <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:20px;height:2px;background:repeating-linear-gradient(90deg,#C7CCD8 0 5px,transparent 5px 9px)\"><\u002Fspan>has float<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 320px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"{{ nodeKindChip }}\">{{ sel.kind }}<\u002Fdiv>\n                <div style=\"font-size:16px;font-weight:700;letter-spacing:-.015em;margin-top:8px\">{{ sel.name }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#5F6368;margin-top:3px\">{{ sel.owner }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0;padding:14px 0;border-top:1px solid #F0F2F6;border-bottom:1px solid #F0F2F6\">\n                  <div><div style=\"font-size:10.5px;color:#8A90A0\">Commitment<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:2px\">{{ sel.target }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:10.5px;color:#8A90A0\">Trigger<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:2px\">{{ sel.cal }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:10.5px;color:#8A90A0\">State<\u002Fdiv><div style=\"{{ sel.stateStyle }}\">{{ sel.state }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:10.5px;color:#8A90A0\">Path<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:2px\">{{ sel.crit }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9AA0AE;margin-bottom:10px\">Impact chain<\u002Fdiv>\n                <sc-for list=\"{{ sel.chain }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:10px;padding:9px 0;border-top:1px solid #F0F2F6\">\n                    <span style=\"{{ c.dot }}\"><\u002Fspan>\n                    <div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:600\">{{ c.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:1px;line-height:1.45\">{{ c.effect }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"{{ sel.noteStyle }}\">{{ sel.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden\">\n              <div style=\"padding:16px 22px;border-bottom:1px solid #E4E7EE\">\n                <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">Duration breakdown<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">Each OLA and UC with its commitment, when it runs on the target clock, and how much it can slip before the target is missed.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:64px minmax(210px,1.3fr) 84px 130px minmax(220px,2fr) 96px 96px;gap:14px;min-width:1040px;padding:10px 22px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n                  <div>Type<\u002Fdiv><div>Commitment · owner<\u002Fdiv><div>Duration<\u002Fdiv><div>Runs<\u002Fdiv><div>Timeline<\u002Fdiv><div>Can slip<\u002Fdiv><div>State<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ durRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.rowStyle }}\" style-hover=\"background:#F6F8FC\">\n                    <div><span style=\"{{ r.kindChip }}\">{{ r.kind }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"min-width:0\"><div style=\"font-weight:600\">{{ r.name }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ r.id }} · {{ r.owner }} · {{ r.depText }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"font-weight:700\">{{ r.durText }}<\u002Fdiv>\n                    <div style=\"color:#5F6368;font-size:12px\">{{ r.window }}<\u002Fdiv>\n                    <div style=\"position:relative;height:14px;border-radius:3px;background:#F0F2F6\">\n                      <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n                      <div style=\"{{ r.markStyle }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"{{ r.floatStyle }}\">{{ r.floatText }}<\u002Fdiv>\n                    <div style=\"{{ r.stateStyle }}\">{{ r.state }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ durTotals }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ t.rowStyle }}\">\n                    <div><\u002Fdiv>\n                    <div><div style=\"font-weight:700\">{{ t.label }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ t.sub }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"{{ t.valStyle }}\">{{ t.value }}<\u002Fdiv>\n                    <div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ agVersionsTab }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow-x:auto;max-width:960px\">\n            <div style=\"padding:14px 20px;border-bottom:1px solid #E4E7EE;display:flex;align-items:center;gap:12px\">\n              <div style=\"flex:1;font-size:14px;font-weight:700\">Version history<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Compare<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">+ New version<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:70px 120px 160px minmax(240px,1fr);gap:14px;min-width:680px;padding:12px 20px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n              <div>Ver<\u002Fdiv><div>Effective<\u002Fdiv><div>Approved by<\u002Fdiv><div>Change summary<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ ag.versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:70px 120px 160px minmax(240px,1fr);gap:14px;min-width:680px;padding:14px 20px;border-bottom:1px solid #F0F2F6;font-size:12.5px\">\n                <div style=\"font-weight:700\">v{{ v.n }}<\u002Fdiv><div style=\"color:#5F6368\">{{ v.date }}<\u002Fdiv><div style=\"color:#5F6368\">{{ v.by }}<\u002Fdiv><div>{{ v.summary }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SERVICE TARGET BUILDER ============ -->\n      <sc-if value=\"{{ isTargets }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1160px\">\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:12px;flex-wrap:wrap\">\n          <span sc-camel-on-click=\"{{ goAgList }}\" style=\"color:#1565C0;font-weight:600;cursor:pointer\">Agreements<\u002Fspan><span style=\"color:#B9BFCC\">›<\u002Fspan>\n          <span sc-camel-on-click=\"{{ goAgDetail }}\" style=\"color:#1565C0;font-weight:600;cursor:pointer\">{{ tgtAgName }}<\u002Fspan><span style=\"color:#B9BFCC\">›<\u002Fspan>\n          <span style=\"color:#5F6368\">{{ tgtName }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:220px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ tgtHeading }}<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">Level 2 · belongs to {{ tgtAgName }} v{{ tgtAgVersion }}. {{ tgtRulesNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-shrink:0\">\n            <div sc-camel-on-click=\"{{ goAgDetail }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Save as draft<\u002Fdiv>\n            <sc-if value=\"{{ tgtNotCreate }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ goAgDetail }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Save target<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tgtCreate }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"flex:0 0 240px;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px\">\n            <div style=\"font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0AE;padding:8px 12px 6px\">One step per tab<\u002Fdiv>\n            <sc-for list=\"{{ ncSteps }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\"><span style=\"{{ s.num }}\">{{ s.mark }}<\u002Fspan><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ s.label }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:1px\">{{ s.sub }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n\n            <div style=\"background:#F6F8FC;border:1px solid #DCE3F0;border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:220px\"><div style=\"font-size:11px;font-weight:700;color:#5F6368;letter-spacing:.04em;text-transform:uppercase\">{{ ncGuide.title }}<\u002Fdiv><div style=\"font-size:13px;color:#1A1A1A;margin-top:4px;line-height:1.5;text-wrap:pretty\">{{ ncGuide.what }}<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ ncHasNeed }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ ncGuide.chip }}\">{{ ncGuide.need }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ nc_def }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-if value=\"{{ ncPatNone }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Choose a target template<\u002Fdiv>\n              <div style=\"font-size:12px;color:#5F6368;margin-bottom:6px;line-height:1.5;max-width:680px;text-wrap:pretty\">A template sets up a whole target: what is promised, how it is measured, who is told and when it applies. Every step is pre-filled, so you only change what is different.<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;line-height:1.5;max-width:680px\">This is not the metric list. Extra metrics, such as downtime minutes or latency, are added in step 3.<\u002Fdiv>\n              <sc-for list=\"{{ ncPatGroups }}\" as=\"pg\" hint-placeholder-count=\"2\">\n                <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A90A0;margin:6px 0 8px\">{{ pg.g }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px\">\n                  <sc-for list=\"{{ pg.items }}\" as=\"p\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\" style-hover=\"border-color:#17213C;background:#F6F8FC\"><div style=\"font-size:13px;font-weight:700\">{{ p.label }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6368;line-height:1.45;flex:1\">{{ p.d }}<\u002Fdiv><div style=\"font-size:12px;font-weight:600;color:#1565C0\">Use this template →<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div sc-camel-on-click=\"{{ ncPatBlank }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">Or start blank, with every field empty<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ncPatChosen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:#EEF7F0;border:1px solid #CFE6D6;font-size:12.5px;color:#1E5B33\"><div style=\"flex:1;min-width:220px;line-height:1.45\">{{ ncPatLabel }}<\u002Fdiv><div sc-camel-on-click=\"{{ ncPatReset }}\" style=\"font-weight:600;color:#1565C0;cursor:pointer\">Change template<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Definition<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px\">The headline commitment. If you add tiers, this becomes the Standard tier.<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target name<\u002Fdiv><input value=\"{{ ncName }}\" sc-camel-on-change=\"{{ setNcName }}\" placeholder=\"e.g. Laptop fulfilment\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.name }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Record type<\u002Fdiv><sc-raw-select value=\"{{ ncRt }}\" sc-camel-on-change=\"{{ setNcRt }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncRtOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.rt }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Measure<\u002Fdiv><sc-raw-select value=\"{{ ncMeasure }}\" sc-camel-on-change=\"{{ setNcMeasure }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncMeasures }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.measure }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ ncValueLabel }}<\u002Fdiv><input value=\"{{ ncValue }}\" sc-camel-on-change=\"{{ setNcValue }}\" placeholder=\"{{ ncValuePh }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.value }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ ncCalLabel }}<\u002Fdiv><sc-raw-select value=\"{{ ncCal }}\" sc-camel-on-change=\"{{ setNcCal }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncCals }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.cal }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target owner<\u002Fdiv><input value=\"{{ ncOwner }}\" sc-camel-on-change=\"{{ setNcOwner }}\" placeholder=\"Person or group\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">{{ ncHelp.owner }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\">\n                <div style=\"flex:1;min-width:220px\"><div style=\"font-size:12px;font-weight:700\">{{ ncAdvTitle }}<\u002Fdiv><div style=\"font-size:12px;color:#5F6368;margin-top:3px;line-height:1.5\">{{ ncAdvSummary }}<\u002Fdiv><\u002Fdiv>\n                <div sc-camel-on-click=\"{{ ncToggleAdv }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">{{ ncAdvLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ ncAdvOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ ncClock }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px;margin-top:14px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Clock starts when<\u002Fdiv><sc-raw-select value=\"{{ ncStart }}\" sc-camel-on-change=\"{{ setNcStart }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncStarts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Clock stops when<\u002Fdiv><sc-raw-select value=\"{{ ncStop }}\" sc-camel-on-change=\"{{ setNcStop }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncStops }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ ncPauseShow }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:16px 0 6px\">{{ ncPauseLabel }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ ncPauses }}\" as=\"p\" hint-placeholder-count=\"4\"><div sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:18px 0 2px\">{{ ncThrTitle }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:8px\">{{ ncThrSub }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px\"><sc-for list=\"{{ ncThr }}\" as=\"t\" hint-placeholder-count=\"3\"><div><div style=\"font-size:11px;color:#5F6368;margin-bottom:5px\">{{ t.label }}<\u002Fdiv><input value=\"{{ t.v }}\" sc-camel-on-change=\"{{ t.set }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_tiers }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:4px\"><div style=\"flex:1;font-size:14px;font-weight:700\">Tiers<\u002Fdiv><div style=\"font-size:12px;font-weight:600\">Offer tiers<\u002Fdiv><div sc-camel-on-click=\"{{ ncToggleTiers }}\" style=\"{{ ncTiersSw.track }}\"><span style=\"{{ ncTiersSw.knob }}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">Different service levels within one target, for example Standard and Fast-track. Each tier has its own commitment and calendar.<\u002Fdiv>\n              <sc-if value=\"{{ ncTiersOff }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:11px 14px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4;font-size:12.5px;color:#3D424E\">One commitment for everyone in scope, taken from Definition: {{ ncValueShow }} on {{ ncCal }}.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ ncTiersOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:56px minmax(130px,1fr) minmax(130px,1fr) minmax(160px,1fr) minmax(160px,1.2fr) 60px;gap:12px;min-width:800px;padding:8px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Default<\u002Fdiv><div>Tier<\u002Fdiv><div>Commitment<\u002Fdiv><div>Calendar<\u002Fdiv><div>Who can choose it<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{ ncTierRows }}\" as=\"t\" hint-placeholder-count=\"1\">\n                  <div style=\"display:grid;grid-template-columns:56px minmax(130px,1fr) minmax(130px,1fr) minmax(160px,1fr) minmax(160px,1.2fr) 60px;gap:12px;min-width:800px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:center\">\n                    <div><span sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.radio }}\"><\u002Fspan><\u002Fdiv>\n                    <input value=\"{{ t.name }}\" sc-camel-on-change=\"{{ t.setName }}\" placeholder=\"Tier name\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <input value=\"{{ t.value }}\" sc-camel-on-change=\"{{ t.setValue }}\" placeholder=\"e.g. 1 business day\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <sc-raw-select value=\"{{ t.cal }}\" sc-camel-on-change=\"{{ t.setCal }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncCals }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                    <input value=\"{{ t.elig }}\" sc-camel-on-change=\"{{ t.setElig }}\" placeholder=\"Roles or user groups\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <div sc-camel-on-click=\"{{ t.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ ncAddTier }}\" style=\"margin-top:12px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add tier<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_metrics }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Metrics<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">The primary metric comes from Definition and decides breach. Pick more from the library. Supporting metrics can raise alerts; indicators are only watched.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px;padding:14px 16px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\">\n                <sc-for list=\"{{ ncMetricGroups }}\" as=\"mg\" hint-placeholder-count=\"4\"><div><div style=\"font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A90A0;margin-bottom:6px\">{{ mg.g }}<\u002Fdiv><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ mg.items }}\" as=\"m\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.style }}\">{{ m.n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:minmax(200px,1.4fr) 130px minmax(140px,1fr) 60px;gap:12px;min-width:620px;padding:8px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Metric<\u002Fdiv><div>Role<\u002Fdiv><div>Target<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:minmax(200px,1.4fr) 130px minmax(140px,1fr) 60px;gap:12px;min-width:620px;padding:12px 0;border-bottom:1px solid #F0F2F6;align-items:center;font-size:12.5px\"><div style=\"font-weight:600\">{{ ncPrimary.name }}<\u002Fdiv><div><span style=\"padding:3px 9px;border-radius:11px;background:#17213C;color:#fff;font-size:11px;font-weight:700\">Primary<\u002Fspan><\u002Fdiv><div style=\"color:#5F6368\">{{ ncPrimary.target }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;text-align:right\">From step 1<\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{ ncMetricRows }}\" as=\"m\" hint-placeholder-count=\"1\">\n                  <div style=\"display:grid;grid-template-columns:minmax(200px,1.4fr) 130px minmax(140px,1fr) 60px;gap:12px;min-width:620px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:center\">\n                    <input value=\"{{ m.name }}\" sc-camel-on-change=\"{{ m.setName }}\" placeholder=\"Metric name\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <sc-raw-select value=\"{{ m.role }}\" sc-camel-on-change=\"{{ m.setRole }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncRoles }}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                    <input value=\"{{ m.target }}\" sc-camel-on-change=\"{{ m.setTarget }}\" placeholder=\"e.g. ≤ 15 min\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <div sc-camel-on-click=\"{{ m.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ ncAddMetric }}\" style=\"margin-top:12px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add a custom metric<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_esc }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Escalation matrix<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:12px\">Start from a matrix template or from blank. Trigger points come from the thresholds in Definition.<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px\"><sc-for list=\"{{ ncEscOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ o.go }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <sc-if value=\"{{ ncEscNone }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:11px 14px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4;font-size:12.5px;color:#5F6368\">Pick a starting point to set recipients and channels.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ ncEscHas }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:150px minmax(170px,1fr) minmax(170px,1fr) minmax(160px,1fr);gap:12px;min-width:700px;padding:8px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Level<\u002Fdiv><div>Fires at<\u002Fdiv><div>Recipient<\u002Fdiv><div>Channel<\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{ ncEscRows }}\" as=\"l\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:150px minmax(170px,1fr) minmax(170px,1fr) minmax(160px,1fr);gap:12px;min-width:700px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:center;font-size:12.5px\">\n                    <div style=\"font-weight:700\">{{ l.level }}<\u002Fdiv><div style=\"color:#5F6368\">{{ l.trig }}<\u002Fdiv>\n                    <input value=\"{{ l.rec }}\" sc-camel-on-change=\"{{ l.setRec }}\" placeholder=\"Person or role\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <input value=\"{{ l.ch }}\" sc-camel-on-change=\"{{ l.setCh }}\" placeholder=\"e.g. Email + SMS\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_support }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Supporting commitments<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">The internal teams, vendors and approvals this target depends on, in the order they run. Feasibility against calendars and cut-offs is validated on save.<\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:120px minmax(220px,1.6fr) 150px 60px;gap:12px;min-width:600px;padding:8px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Kind<\u002Fdiv><div>Commitment<\u002Fdiv><div>Expected duration<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                <sc-if value=\"{{ ncSupEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:14px 0;font-size:12px;color:#8A90A0;min-width:600px\">No supporting commitments yet. Activation is blocked until the path is linked and validated.<\u002Fdiv><\u002Fsc-if>\n                <sc-for list=\"{{ ncSupRows }}\" as=\"s\" hint-placeholder-count=\"1\">\n                  <div style=\"display:grid;grid-template-columns:120px minmax(220px,1.6fr) 150px 60px;gap:12px;min-width:600px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:center\">\n                    <sc-raw-select value=\"{{ s.kind }}\" sc-camel-on-change=\"{{ s.setKind }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncKinds }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                    <sc-raw-select value=\"{{ s.ref }}\" sc-camel-on-change=\"{{ s.setRef }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ s.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                    <input value=\"{{ s.dur }}\" sc-camel-on-change=\"{{ s.setDur }}\" placeholder=\"e.g. 4 business hrs\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                    <div sc-camel-on-click=\"{{ s.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ ncAddSup }}\" style=\"margin-top:12px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add step<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_cap }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Capacity &amp; feasibility<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;line-height:1.5;max-width:680px\">Rough numbers are fine. They are used until there are 4 weeks of real records, then the forecast takes over.<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 22px\"><sc-for list=\"{{ ncCapFields }}\" as=\"f\" hint-placeholder-count=\"6\"><div><div style=\"font-size:12px;font-weight:600;color:#1A1A1A;margin-bottom:6px\">{{ f.label }}<\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><sc-if value=\"{{ f.isIn }}\" hint-placeholder-val=\"{{ true }}\"><input value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"width:110px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fsc-if><sc-if value=\"{{ f.isSel }}\" hint-placeholder-val=\"{{ false }}\"><sc-raw-select value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ f.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if><div style=\"font-size:12px;color:#5F6368\">{{ f.unit }}<\u002Fdiv><\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:5px;line-height:1.45\">{{ f.help }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <sc-if value=\"{{ ncCapNone }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top:16px;padding:11px 14px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4;font-size:12.5px;color:#5F6368\">Enter demand, effort and people to see whether the busiest week fits.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ ncCapHas }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:#EEF0F5;border:1px solid #EEF0F5;border-radius:8px;overflow:hidden;margin-top:18px\"><sc-for list=\"{{ ncCapOut }}\" as=\"o\" hint-placeholder-count=\"3\"><div style=\"background:#fff;padding:12px 14px\"><div style=\"font-size:10.5px;color:#8A90A0;margin-bottom:4px\">{{ o.k }}<\u002Fdiv><div style=\"font-size:16px;font-weight:700\">{{ o.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:12px;color:#5F6368;margin-top:10px;line-height:1.5\">{{ ncCapMath }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap\"><span style=\"{{ ncCapChip }}\">{{ ncCapChipLabel }}<\u002Fspan><div style=\"font-size:12.5px;color:#3D424E\">{{ ncCapVerdict }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_rules }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Applicability rules<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">{{ ncRulesSub }}<\u002Fdiv>\n              <sc-if value=\"{{ ncRulesEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:6px 0 10px;font-size:12px;color:#8A90A0\">No conditions yet.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ ncRuleRows }}\" as=\"r\" hint-placeholder-count=\"1\">\n                <div style=\"display:grid;grid-template-columns:56px minmax(160px,1fr) 110px minmax(180px,1.2fr) 60px;gap:10px;padding:8px 0;align-items:center\">\n                  <div style=\"font-size:11px;font-weight:700;color:#5F6368\">{{ r.joinLabel }}<\u002Fdiv>\n                  <sc-raw-select value=\"{{ r.field }}\" sc-camel-on-change=\"{{ r.setField }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncRuleFields }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                  <sc-raw-select value=\"{{ r.op }}\" sc-camel-on-change=\"{{ r.setOp }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ ncOps }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                  <input value=\"{{ r.val }}\" sc-camel-on-change=\"{{ r.setVal }}\" placeholder=\"Value\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                  <div sc-camel-on-click=\"{{ r.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div sc-camel-on-click=\"{{ ncAddRule }}\" style=\"margin-top:6px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add condition<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px;margin-top:16px;padding-top:14px;border-top:1px solid #F0F2F6\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Precedence weight<\u002Fdiv><input value=\"{{ ncWeight }}\" sc-camel-on-change=\"{{ setNcWeight }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Specificity<\u002Fdiv><div style=\"padding:8px 0;font-size:12.5px;font-weight:700\">{{ ncSpec }} <span style=\"font-weight:400;color:#8A90A0\">· one per condition<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;padding:10px 13px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">{{ ncRulePreview }}<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ nc_ready }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Readiness<\u002Fdiv>\n              <div style=\"padding:12px 14px;border-radius:8px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.55;margin:8px 0 16px\">\n                <div style=\"font-weight:700;color:#17213C;margin-bottom:2px\">What Readiness is for<\u002Fdiv>\n                A signed go / no-go decision that this target can be met from its first day live. It confirms the commitment is achievable, the teams and suppliers behind it are linked, and someone accountable agrees. The decision, approver, date and reasons are kept in the audit trail and shown in Versions.\n              <\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">1 · Automatic checks<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:6px\">From what you entered in each step.<\u002Fdiv>\n              <sc-for list=\"{{ ncChecks }}\" as=\"c\" hint-placeholder-count=\"7\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F0F2F6;font-size:12.5px;flex-wrap:wrap\"><div style=\"flex:1;min-width:200px\"><div style=\"font-weight:600\">{{ c.label }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0\">{{ c.step }}<\u002Fdiv><\u002Fdiv><span style=\"{{ c.chip }}\">{{ c.state }}<\u002Fspan><div sc-camel-on-click=\"{{ c.go }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">Open<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:12px;font-weight:700;margin:20px 0 10px\">2 · Record the decision<\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Purpose of this target<\u002Fdiv><textarea value=\"{{ ncPurpose }}\" sc-camel-on-change=\"{{ setNcPurpose }}\" rows=\"2\" placeholder=\"e.g. New starters must have a working laptop on day one, so onboarding is not delayed.\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;font-family:inherit;resize:vertical\"><\u002Ftextarea><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">Why this target exists and what business outcome it protects. Shown to reviewers and on the target record.<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:14px 0 6px\">Decision<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><sc-for list=\"{{ ncDecisions }}\" as=\"d\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\"><div style=\"{{ d.kst }}\">{{ d.k }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6368;line-height:1.4\">{{ d.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <sc-if value=\"{{ ncRiskShow }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Accepted risk<\u002Fdiv><input value=\"{{ ncRisk }}\" sc-camel-on-change=\"{{ setNcRisk }}\" placeholder=\"e.g. Out-of-hours build not rostered until November\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px\">What gap is accepted, and until when.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Approver<\u002Fdiv><input value=\"{{ ncApprover }}\" sc-camel-on-change=\"{{ setNcApprover }}\" placeholder=\"e.g. Service Owner\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px\">Accountable for the decision.<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Planned go-live <span style=\"font-weight:400;color:#8A90A0\">· optional<\u002Fspan><\u002Fdiv><input value=\"{{ ncGoLive }}\" sc-camel-on-change=\"{{ setNcGoLive }}\" placeholder=\"e.g. 01 Dec 2026\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ ncOutcomeBox }}\"><div style=\"font-weight:700\">{{ ncOutcome }}<\u002Fdiv><div style=\"margin-top:2px\">{{ ncOutcomeText }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Calculated after you create it<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:6px\">These parts of the tabs are not entered. They fill in from the data above and from live records.<\u002Fdiv>\n              <sc-for list=\"{{ ncLater }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid #F0F2F6;font-size:12.5px\"><div style=\"font-weight:700\">{{ l.k }}<\u002Fdiv><div style=\"color:#5F6368;line-height:1.45\">{{ l.v }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <sc-if value=\"{{ ncHasBack }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ ncBack }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">← Back<\u002Fdiv><\u002Fsc-if>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <sc-if value=\"{{ ncSkippable }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ ncNext }}\" style=\"font-size:12.5px;font-weight:600;color:#1565C0;cursor:pointer\">Skip for now<\u002Fdiv><\u002Fsc-if>\n              <div sc-camel-on-click=\"{{ ncNext }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ ncNextLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tgtIsXla }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"border-radius:10px;padding:18px 20px;border:1px solid #E0D6F2;background:#F7F3FE\">\n            <div style=\"display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:240px\">\n                <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em;color:#4A2E86;margin-bottom:4px\">Experience level target · measured, not clocked<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#4A4358;line-height:1.55\">An XLA has no clock, no calendar and no breach event. It is sampled from surveys and feedback forms over a rolling window, so the builder collects the instrument, the question, the score bands and the drivers instead of a duration and thresholds.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Preview survey<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:18px\">Experience measure<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 20px\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target name<\u002Fdiv><input value=\"{{ tgtName }}\" sc-camel-on-change=\"{{ setTgtName }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Parent agreement · level 1<\u002Fdiv>\n                <sc-raw-select value=\"{{ tgtAgId }}\" sc-camel-on-change=\"{{ setTgtAg }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ agreementOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <div style=\"font-size:11px;color:#8A90A0;margin-top:5px\">{{ tgtAgHint }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Experience measure<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ measureOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Instrument<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ instrumentOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Scale<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ scaleOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Committed score<\u002Fdiv><div style=\"display:flex;gap:8px\"><input value=\"4.3\" style=\"width:74px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><sc-raw-select style=\"flex:1;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px\"><option>or better (1–5)<\u002Foption><option>or better (0–10)<\u002Foption><option>or lower (effort)<\u002Foption><\u002Fsc-raw-select><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Rolling window<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option>Quarter, rolling<\u002Foption><option>12 weeks, rolling<\u002Foption><option>Calendar quarter<\u002Foption><option>Half-year<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Minimum responses for validity<\u002Fdiv><input value=\"30\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Segmentation<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option>Business unit + location<\u002Foption><option>Persona (new joiner, manager, field)<\u002Foption><option>Offering<\u002Foption><option>None — whole population<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:18px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Survey question as it is asked<\u002Fdiv>\n              <textarea rows=\"2\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;resize:vertical;font-family:inherit\">How satisfied were you with the way your request was handled, end to end?<\u002Ftextarea><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Collection triggers<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0\">When the instrument fires, who receives it, and how long they have to respond.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">+ Add trigger<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"display:grid;grid-template-columns:minmax(190px,1.2fr) 150px 140px 120px 70px;gap:14px;min-width:760px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n                <div>Trigger event<\u002Fdiv><div>Audience<\u002Fdiv><div>Channel<\u002Fdiv><div>Response window<\u002Fdiv><div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ xlaTriggers }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:minmax(190px,1.2fr) 150px 140px 120px 70px;gap:14px;min-width:760px;padding:13px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n                  <div style=\"font-weight:600\">{{ t.event }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.audience }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.channel }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.window }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Score bands and what each one triggers<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px\">XLAs replace percentage-consumed thresholds: there is no clock to escalate against, so action is driven by the band the rolling score lands in.<\u002Fdiv>\n            <sc-for list=\"{{ xlaBands }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #F0F2F6;flex-wrap:wrap\">\n                <span style=\"{{ b.dot }}\"><\u002Fspan>\n                <div style=\"width:104px;font-size:12.5px;font-weight:700\">{{ b.label }}<\u002Fdiv>\n                <div style=\"width:96px;font-size:12.5px;color:#5F6368\">{{ b.range }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:200px;font-size:12.5px;color:#3D424E\">{{ b.action }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:
