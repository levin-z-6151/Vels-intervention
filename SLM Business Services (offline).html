document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ver=\"background:#243356\">Record SLA panel<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ r.openAudit }}\" style=\"padding:7px 13px;border-radius:6px;border:1px solid #D5D9E2;background:#fff;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#17213C\">Audit trail<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ r.go }}\" style=\"margin-left:auto;font-size:11.5px;color:#8A90A0;font-weight:600;cursor:pointer\">Close<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noRisk }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:34px 20px;text-align:center;font-size:12.5px;color:#8A90A0\">No targets match this view and filter combination.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\">\n              <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px\">Attainment by offering<\u002Fdiv>\n              <sc-for list=\"{{ attainment }}\" as=\"a\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ a.go }}\" style=\"margin:0 -8px 6px;padding:6px 8px;border-radius:6px;cursor:pointer\" style-hover=\"background:#FAFBFD\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px\"><span style=\"font-weight:600\">{{ a.name }}<\u002Fspan><span style=\"{{ a.pctStyle }}\">{{ a.pct }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:7px;border-radius:4px;background:#EEF0F5;overflow:hidden\"><div style=\"{{ a.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\">\n              <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px\">Breach causes · 30 days<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">Feeds improvement opportunities<\u002Fdiv>\n              <sc-for list=\"{{ causes }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 8px;margin:0 -8px;border-top:1px solid #F0F2F6;cursor:pointer;border-radius:6px\" style-hover=\"background:#FAFBFD\">\n                  <div style=\"flex:1;font-size:12.5px\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;font-weight:700\">{{ c.n }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ AGREEMENTS LIST / DETAIL ============ -->\n      <sc-if value=\"{{ isAgreements }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1320px\">\n\n\n        <sc-if value=\"{{ agFormView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:960px\">\n          <div sc-camel-on-click=\"{{ cancelForm }}\" style=\"font-size:12.5px;font-weight:600;color:#1565C0;cursor:pointer;margin-bottom:12px\">← Cancel and go back<\u002Fdiv>\n          <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ formTitle }}<\u002Fh1>\n          <div style=\"font-size:13px;color:#5F6368;margin-bottom:22px\">{{ formSub }}<\u002Fdiv>\n          <sc-if value=\"{{ agIsNew }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-wrap:wrap;background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden;margin-bottom:16px\">\n            <sc-for list=\"{{ agSteps }}\" as=\"s\" hint e=\"{{ c.kst }}\">{{ c.k }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6368;line-height:1.4\">{{ c.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 20px\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Agreement name<\u002Fdiv><input value=\"{{ fName }}\" sc-camel-on-change=\"{{ setFName }}\" placeholder=\"{{ fNamePh }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">A name people will recognise in reports.<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ agNotNew }}\" hint-placeholder-val=\"{{ true }}\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Commitment type<\u002Fdiv>\n                <sc-raw-select value=\"{{ fType }}\" sc-camel-on-change=\"{{ setFType }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ typeOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <\u002Fsc-if>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Scope<\u002Fdiv><input value=\"{{ fScope }}\" sc-camel-on-change=\"{{ setFScope }}\" placeholder=\"e.g. All employees, laptops and peripherals\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.4\">Who or what it covers, in a few words.<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Agreement laceholder-val=\"{{ true }}\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Lifecycle status<\u002Fdiv>\n                <sc-raw-select value=\"{{ fStatus }}\" sc-camel-on-change=\"{{ setFStatus }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ statusOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"margin-top:18px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Purpose and commitment summary <span style=\"font-weight:400;color:#8A90A0\">· optional<\u002Fspan><\u002Fdiv>\n              <textarea value=\"{{ fDesc }}\" sc-camel-on-change=\"{{ setFDesc }}\" rows=\"3\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;resize:vertical;font-family:inherit\"><\u002Ftextarea><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ fsPeople }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Optional capabilities<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:10px\">Each one adds its own section below. Leave them off for an ordinary agreement.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px\">\n              <sc-for list=\"{{ bzCaps }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #F0F2F6\"><div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ c.label }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ c.d }}<\u002Fdiv><\u002Fdiv><div sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.sw.track }}\"><span style=\"{{ c.sw.knob }}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Stakeholders<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n              <div style=\"flex:1;min-width:260px;font-size:11.5px;color:#8A90A0;line-height:1.5\">One person can hold several roles unless separation of duty prevents it. The approver cannot also be the service owner.<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"text-align:right\"><div style=\"font-size:12px;font-weight:600\">Backup owners<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0\">Who takes over a role when the holder is away<\u002Fdiv><\u002Fdiv><div sc-camel-on-click=\"{{ bzToggleBk }}\" style=\"{{ bzBkSw.track }}\"><span style=\"{{ bzBkSw.knob }}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ bzRoleMissing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:10px 13px;border-radius:7px;background:#FDF6E9;border:1px solid #F1DFBC;color:#7A4B00;font-size:12px;margin-bottom:12px\">{{ bzRoleMissingText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"overflow-x:auto\">\n              <div style=\"{{ bzRoleGridH }}\"><div>Role<\u002Fdiv><div>Person or group<\u002Fdiv><div>Responsibility<\u002Fdiv><div>Approval authority<\u002Fdiv><sc-if value=\"{{ bzBkOn }}\" hint-placeholder-val=\"{{ false }}\"><div>Backup owner · effective<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n              <sc-for list=\"{{ bzRoles }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"{{ bzRoleGrid }}\">\n                  <div style=\"font-weight:700\">{{ r.role }}<\u002Fdiv>\n                  <div>\n                    <sc-if value=\"{{ r.has }}\" hint-placeholder-val=\"{{ true }}\"><input value=\"{{ r.holder }}\" placeholder=\"{{ r.ph }}\" style=\"width:100%;padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px\"><\u002Fsc-if>\n                    <sc-if value=\"{{ r.missing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:7px 10px;border:1px dashed #E8A33D;border-radius:6px;font-size:12px;color:#A35C00;background:#FFF8EC\">Required · not assigned<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"color:#5F6368;line-height:1.4\">{{ r.resp }}<\u002Fdiv>\n                  <div style=\"color:#3D424E;line-height:1.4\">{{ r.auth }}<\u002Fdiv>\n                  <sc-if value=\"{{ bzBkOn }}\" hint-placeholder-val=\"{{ false }}\"><div><input value=\"{{ r.bk }}\" placeholder=\"Not nominated\" style=\"width:100%;padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px\"><div style=\"font-size:11px;color:#8A90A0;margin-top:3px\">{{ r.bkWhen }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ bzBkOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px;margin-top:16px\"><sc-for list=\"{{ bzOwnership }}\" as=\"f\" hint-placeholder-count=\"2\"><div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ f.k }}<\u002Fdiv><input value=\"{{ f.v }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-top:10px;line-height:1.5\">A backup owner takes over accountability for the role. Who does the work when a team is unavailable is set per Target, in its supporting composition.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px\">\n            <div style=\"flex:1 1 380px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Reviews<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">Who reviews this agreement, how often, and what the review covers.<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 16px\"><sc-for list=\"{{ bzReviewFields }}\" as=\"f\" hint-placeholder-count=\"4\"><div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ f.k }}<\u002Fdiv><input value=\"{{ f.v }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:16px 0 6px\">Linked outcomes and improvements<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ bzReviewLinks }}\" as=\"l\" hint-placeholder-count=\"3\"><span style=\"padding:4px 10px;border-radius:5px;background:#F1F3F8;color:#3D424E;font-size:11.5px;font-weight:600\">{{ l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ bzCapAssure }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap\"><div style=\"font-size:14px;font-weight:700\">Service assurance<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700;letter-spacing:.02em\">ASSURANCE · NOT AN SLA LAYER<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;line-height:1.5;max-width:720px;text-wrap:pretty\">What every Target in this agreement shares: who owns capacity and resilience, how far ahead demand is forecast, the business calendar of busy periods, and continuity plans. Each Target uses these to check its own capacity.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 20px\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Capacity owner<\u002Fdiv><input value=\"{{ as.owner }}\" sc-camel-on-change=\"{{ asSet.owner }}\" placeholder=\"e.g. IT Capacity &amp; Demand Lead\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">Plans capacity, and acts when demand outgrows it.<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Resilience owner<\u002Fdiv><input value=\"{{ as.res }}\" sc-camel-on-change=\"{{ asSet.res }}\" placeholder=\"e.g. Service Continuity Manager\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">Owns the continuity plans linked below.<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Service criticality<\u002Fdiv><sc-raw-select value=\"{{ as.crit }}\" sc-camel-on-change=\"{{ asSet.crit }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ asCrits }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">{{ asCritText }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:13px;font-weight:700;margin:24px 0 2px\">Forecast horizon<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:10px;line-height:1.5;max-width:720px;text-wrap:pretty\">How far ahead the system predicts demand. A longer horizon shows shortfalls earlier, so there is time to add people or supplier slots.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 20px\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Look ahead<\u002Fdiv><sc-raw-select value=\"{{ as.horizon }}\" sc-camel-on-change=\"{{ asSet.horizon }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ asHorizons }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Recalculate<\u002Fdiv><sc-raw-select value=\"{{ as.refresh }}\" sc-camel-on-change=\"{{ asSet.refresh }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ asRefreshes }}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:12px;color:#3D424E;line-height:1.5\">{{ asHorizonText }}<\u002Fdiv>\n\n            <div style=\"margin-top:22px;padding:14px 16px;border-radius:8px;background:#F6F8FC;border:1px solid #DCE3F0\">\n              <div style=\"font-size:12px;font-weight:700;color:#17213C\">Set on each Target, not here<\u002Fdiv>\n              <div style=\"font-size:12px;color:#33405E;margin-top:3px;line-height:1.5;max-width:760px\">Expected demand, volume limits and what happens to excess demand, supplier capacity from UCs, and the workforce plan all depend on one commitment. They are set in each Target’s Capacity &amp; feasibility tab. This section only holds what every Target in the agreement shares.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:13px;font-weight:700;margin:24px 0 2px\">Major demand periods<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:10px;line-height:1.5;max-width:720px;text-wrap:pretty\">The shared business calendar of busy times. Every Target’s weekly forecast picks these up automatically as “events”. A Target can add its own events on top.<\u002Fdiv>\n            <sc-if value=\"{{ asPeriodsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:6px 0 4px;font-size:12px;color:#8A90A0\">None yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ asPeriods }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid #F0F2F6;flex-wrap:wrap;font-size:12.5px\">\n                <div style=\"flex:1 1 180px;font-weight:600\">{{ p.name }}<\u002Fdiv><div style=\"flex:1 1 220px;color:#5F6368\">{{ p.when }}<\u002Fdiv><div style=\"flex:0 0 190px;color:#3D424E\">{{ p.upLabel }}<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;font-size:11.5px;font-weight:600\"><span sc-camel-on-click=\"{{ p.edit }}\" style=\"color:#1565C0;cursor:pointer\">Edit<\u002Fspan><span sc-camel-on-click=\"{{ p.remove }}\" style=\"color:#C62828;cursor:pointer\">Remove<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ asAddPeriod }}\" style=\"margin-top:10px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add demand period<\u002Fdiv>\n            <sc-if value=\"{{ asPanelPeriod }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;border:1.5px solid #17213C;border-radius:10px;background:#FAFBFD;padding:18px 20px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:14px\">{{ pp.title }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Name<\u002Fdiv><input value=\"{{ pp.name }}\" sc-camel-on-change=\"{{ pp.setName }}\" placeholder=\"e.g. Month-end close\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">When does it happen?<\u002Fdiv><input value=\"{{ pp.when }}\" sc-camel-on-change=\"{{ pp.setWhen }}\" placeholder=\"e.g. Last 5 business days of each month\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">Dates, days or a repeating pattern.<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">How much busier than normal?<\u002Fdiv><sc-raw-select value=\"{{ pp.uplift }}\" sc-camel-on-change=\"{{ pp.setUplift }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ asUpOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><div style=\"font-size:11px;color:#8A90A0;margin-top:4px;line-height:1.45\">Applied to the forecast for these dates.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:16px\">\n                <div sc-camel-on-click=\"{{ asCancel }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ ppSave }}\" style=\"{{ ppBtn }}\">Save period<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-size:13px;font-weight:700;margin:24px 0 2px\">Continuity plans<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:10px;line-height:1.5;max-width:720px;text-wrap:pretty\">Service-wide plans for when something major fails. Select one to see what it covers. Supplier arrangements belong to the UCs linked in each Target.<\u002Fdiv>\n            <sc-if value=\"{{ asLinksEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:6px 0 4px;font-size:12px;color:#8A90A0\">None linked yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ asLinks }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"border-top:1px solid #F0F2F6\">\n                <div sc-camel-on-click=\"{{ g.toggle }}\" style=\"display:flex;align-items:center;gap:14px;padding:11px 0;flex-wrap:wrap;font-size:12.5px;cursor:pointer\"><div style=\"width:14px;color:#8A90A0\">{{ g.chev }}<\u002Fdiv><div style=\"width:150px;color:#8A90A0\">{{ g.k }}<\u002Fdiv><div style=\"flex:1;min-width:200px;font-weight:600;color:#1565C0\">{{ g.ref }}<\u002Fdiv><span style=\"{{ g.chip }}\">{{ g.status }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin:0 0 12px 28px;padding:12px 14px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\">\n                  <div style=\"font-size:12.5px;color:#3D424E;line-height:1.5\">{{ g.covers }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:#5F6368\"><div>Owner · <b style=\"color:#1A1A1A\">{{ g.owner }}<\u002Fb><\u002Fdiv><div>Last reviewed · <b style=\"color:#1A1A1A\">{{ g.rev }}<\u002Fb><\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;gap:16px;margin-top:10px;font-size:12px;font-weight:600\"><span sc-camel-on-click=\"{{ noop }}\" style=\"color:#1565C0;cursor:pointer\">{{ g.openSrc }}<\u002Fspan><span sc-camel-on-click=\"{{ g.remove }}\" style=\"color:#C62828;cursor:pointer\">Unlink<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ asAddLink }}\" style=\"margin-top:10px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Link a continuity plan<\u002Fdiv>\n            <sc-if value=\"{{ asPanelLink }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;border:1.5px solid #17213C;border-radius:10px;background:#FAFBFD;padding:18px 20px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:14px\">Link a continuity plan<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Kind<\u002Fdiv><sc-raw-select value=\"{{ lk.k }}\" sc-camel-on-change=\"{{ lk.setK }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ lkKinds }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Plan<\u002Fdiv><sc-raw-select value=\"{{ lk.ref }}\" sc-camel-on-change=\"{{ lk.setRef }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ lk.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ lkHas }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;font-size:12px;color:#3D424E;line-height:1.5\">{{ lkInfo.covers }} <span style=\"color:#8A90A0\">Owner {{ lkInfo.owner }} · {{ lkInfo.status }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:16px\">\n                <div sc-camel-on-click=\"{{ asCancel }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ lkSave }}\" style=\"{{ lkBtn }}\">Link<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ bzCapGov }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Continuity and contingency<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">Defaults for backups and substitute commitments in this agreement. Each Target configures its own in Supporting commitments → Resilience.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px;margin-bottom:18px\"><sc-for list=\"{{ bzContFields }}\" as=\"f\" hint-placeholder-count=\"6\"><div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ f.k }}<\u002Fdiv><input value=\"{{ f.v }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:2px\">Linked governance<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:6px\">Linked from their source systems. Legal and continuity documents are not copied into SLM.<\u002Fdiv>\n            <sc-for list=\"{{ bzGov }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid #F0F2F6;flex-wrap:wrap;font-size:12.5px\">\n                <div style=\"width:160px;color:#8A90A0\">{{ g.k }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:200px;font-weight:600;color:#1565C0\">{{ g.v }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8A90A0\">{{ g.src }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"margin-top:10px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Link continuity plan or obligation<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ bzCapRemedies }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap\"><div style=\"font-size:14px;font-weight:700\">Commercial remedies<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#FDECEA;color:#A31816;font-size:10.5px;font-weight:700;letter-spacing:.02em\">RESTRICTED · Commercial, Finance<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;line-height:1.5\">Finance and Vendor Management integrations handle settlement. SLM tracks each stage separately.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px\"><sc-for list=\"{{ bzRemedyFields }}\" as=\"f\" hint-placeholder-count=\"6\"><div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ f.k }}<\u002Fdiv><input value=\"{{ f.v }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{ bzRemedyLive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:20px 0 8px\">Current period · August 2026<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:#EEF0F5;border:1px solid #EEF0F5;border-radius:8px;overflow:hidden\">\n              <sc-for list=\"{{ bzRemedyStages }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"background:#fff;padding:12px 14px\"><div style=\"font-size:10.5px;color:#8A90A0;margin-bottom:6px\">{{ s.k }}<\u002Fdiv><span style=\"{{ s.chip }}\">{{ s.s }}<\u002Fspan><div style=\"font-size:11.5px;color:#5F6368;margin-top:6px;line-height:1.4\">{{ s.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ fsAssoc }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Service association<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;max-width:680px;text-wrap:pretty\">Associate this SLA with a whole Service, so it becomes the default for all of that Service's offerings, or with specific Service Offerings. An Offering association overrides its Service's default.<\u002Fdiv>\n            <sc-for list=\"{{ fAssoc }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <div style=\"display:grid;grid-template-columns:112px minmax(180px,1fr) minmax(160px,auto) 70px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #F0F2F6;font-size:12.5px\">\n                <div><span style=\"{{ a.levelChip }}\">{{ a.level }}<\u002Fspan><\u002Fdiv>\n                <div style=\"min-width:0\"><div style=\"font-weight:600\">{{ a.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0\">{{ a.parent }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#5F6368\">{{ a.coverage }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ a.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ fAssocEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:11px 14px;border-radius:7px;background:#FDF6E9;border:1px solid #F1DFBC;color:#7A4B00;font-size:12px\">An SLA needs at least one Service or Service Offering association before it can be activated.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #F0F2F6\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Associate with<\u002Fdiv>\n                <div style=\"display:flex;border:1px solid #D5D9E2;border-radius:6px;overflow:hidden\">\n                  <sc-for list=\"{{ fAssocLevels }}\" as=\"l\" hint-placeholder-count=\"2\"><div sc-camel-on-click=\"{{ l.go }}\" style=\"{{ l.style }}\">{{ l.label }}<\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;min-width:220px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ fAssocPickLabel }}<\u002Fdiv>\n                <sc-raw-select value=\"{{ fAssocPick }}\" sc-camel-on-change=\"{{ setFAssocPick }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ fAssocOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ addAssoc }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">+ Associate<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ fsTargetsEdit }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px\">\n              <div style=\"flex:1;min-width:200px\">\n                <div style=\"font-size:14px;font-weight:700\">Service targets · level 2<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ formTargetsNote }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ addTarget }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">+ Add target<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ formTargets }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F0F2F6\">\n                <div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ t.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0\">{{ t.measure }} · {{ t.value }} · {{ t.cal }} · {{ t.rules }} rules<\u002Fdiv><\u002Fdiv>\n                <div sc-camel-on-click=\"{{ t.open }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ fsTargetsNew }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Service targets · level 2<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px;line-height:1.5;max-width:720px;text-wrap:pretty\">Name each target and its headline commitment. After the agreement is created, each draft opens its own setup for tiers, metrics, escalation, supporting commitments, capacity, rules and readiness.<\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(160px,1fr) minmax(140px,1fr) minmax(170px,1fr) 60px;gap:12px;min-width:780px;padding:8px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Target name<\u002Fdiv><div>Measure<\u002Fdiv><div>Commitment<\u002Fdiv><div>Calendar<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ fDraftsEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:14px 0;font-size:12px;color:#8A90A0;min-width:780px\">No targets yet. An agreement can be saved without targets but cannot be activated.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ fDrafts }}\" as=\"d\" hint-placeholder-count=\"1\">\n                <div style=\"display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(160px,1fr) minmax(140px,1fr) minmax(170px,1fr) 60px;gap:12px;min-width:780px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:center\">\n                  <input value=\"{{ d.name }}\" sc-camel-on-change=\"{{ d.setName }}\" placeholder=\"e.g. Laptop fulfilment\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                  <sc-raw-select value=\"{{ d.measure }}\" sc-camel-on-change=\"{{ d.setMeasure }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ fDraftMeasures }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                  <input value=\"{{ d.value }}\" sc-camel-on-change=\"{{ d.setValue }}\" placeholder=\"e.g. 2 business days\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\">\n                  <sc-raw-select value=\"{{ d.cal }}\" sc-camel-on-change=\"{{ d.setCal }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ fDraftCals }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                  <div sc-camel-on-click=\"{{ d.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer;text-align:right\">Remove<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ addDraft }}\" style=\"margin-top:12px;font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">+ Add target<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ fsReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Where each tab gets its data<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px;line-height:1.5;max-width:720px;text-wrap:pretty\">An agreement shows more tabs than this form has steps. The rest are entered inside each Target, or calculated by the system. Nothing is filled with sample data.<\u002Fdiv>\n            <sc-for list=\"{{ agTabMap }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) 130px;gap:14px;padding:12px 0;border-top:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n                <div style=\"font-weight:700\">{{ t.tab }}<\u002Fdiv><div style=\"color:#5F6368;line-height:1.45\">{{ t.src }}<\u002Fdiv><div><span style=\"{{ t.chip }}\">{{ t.state }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 26px;margin-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Before it can be activated<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:10px\">You can create it with gaps. It stays in Draft until each item is done.<\u002Fdiv>\n            <sc-for list=\"{{ agChecks }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F0F2F6;font-size:12.5px\"><div style=\"flex:1\">{{ c.label }}<\u002Fdiv><span style=\"{{ c.chip }}\">{{ c.state }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ agIsNew }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <sc-if value=\"{{ agHasBack }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ agBack }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">← Back<\u002Fdiv><\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ cancelForm }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Save as draft<\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <sc-if value=\"{{ agCanSkip }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ agNext }}\" style=\"font-size:12.5px;font-weight:600;color:#1565C0;cursor:pointer\">Skip for now<\u002Fdiv><\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ agNext }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ agNextLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ agNotNew }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ saveForm }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ formSaveLabel }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ cancelForm }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Save as draft<\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0\">Saving creates a new version; the previous version stays immutable for records already sealed against it.<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ agListView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:18px\">\n            <div style=\"flex:1;min-width:0\">\n              <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Agreements<\u002Fh1>\n              <div style=\"font-size:13px;color:#5F6368\">Level 1 of the commitment structure: an agreement holds its service targets, and each SLA or XLA target holds the applicability rules that select it. OLA and UC targets need no rules — they are engaged by the SLA Target or tier they underpin.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-shrink:0\">\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Import<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ newAg }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">+ New agreement<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #E4E7EE;bor solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\"><div style=\"flex:1;font-size:14px;font-weight:700\">Reviews<\u002Fdiv><div sc-camel-on-click=\"{{ editAg }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">Edit<\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0;margin-bottom:14px\">Who reviews this agreement, how often, and what the review covers.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px\"><sc-for list=\"{{ bzReviewFields }}\" as=\"f\" hint-placeholder-count=\"4\"><div><div style=\"font-size:10.5px;color:#8A90A0;margin-bottom:3px\">{{ f.k }}<\u002Fdiv><div style=\"font-size:13px;font-weight:600\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#8A90A0;margin:16px 0 6px\">Linked outcomes and improvements<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ bzReviewLinks }}\" as=\"l\" hint-placeholder-count=\"3\"><span style=\"padding:4px 10px;border-radius:5px;background:#F1F3F8;color:#3D424E;font-size:11.5px;font-weight:600\">{{ l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F6;flex-wrap:wrap;font-size:12px\"><span style=\"color:#8A90A0\">Last review · 14 Oct 2026 · Q3 service review<\u002Fspan><span sc-camel-on-click=\"{{ bzGoOutcomes }}\" style=\"font-weight:600;color:#1565C0;cursor:pointer\">Open review →<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 300px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\">\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9AA0A
