ize:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-radius:10px;padding:18px 20px;border:1px solid #E4E7EE;background:#fff\">\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:12px\">Why this target behaves differently<\u002Fdiv>\n            <sc-for list=\"{{ xlaNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:10px;padding:10px 0;border-top:1px solid #F0F2F6\">\n                <span style=\"{{ n.dot }}\"><\u002Fspan>\n                <div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:600\">{{ n.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.5\">{{ n.detail }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tgtIsStd }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n  <div style=\"display:flex;gap:2px;border-bottom:1px solid #E4E7EE;flex-wrap:wrap\">\n    <sc-for list=\"{{ tgtTabs }}\" as=\"tb\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ tb.go }}\" style=\"{{ tb.style }}\">{{ tb.label }}<\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ tgtHasReval }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:8px;background:#FFF8EC;border:1px solid #F2DFBE;flex-wrap:wrap\">\n    <span style=\"width:8px;height:8px;border-radius:4px;background:#C77700;flex-shrink:0;margin-top:5px\"><\u002Fspan>\n    <div style=\"flex:1;min-width:240px\"><div style=\"font-size:12.5px;font-weight:700;color:#7A4B00\">Revalidation required<\u002Fdiv><div style=\"font-size:12px;color:#7A4B00;margin-top:2px;line-height:1.5\">{{ tgtRevalText }}<\u002Fdiv><\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goReval }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer;white-space:nowrap\">{{ tgtRevalBtn }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tabDef }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n    <div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:18px\">General details<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 20px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target ID<\u002Fdiv><div style=\"padding:8px 11px;border:1px solid #E4E7EE;border-radius:6px;font-size:12.5px;background:#FAFBFD;color:#5F6368\">{{ tgtId }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target name<\u002Fdiv><input value=\"{{ tgtName }}\" sc-camel-on-change=\"{{ setTgtName }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Parent agreement · level 1<\u002Fdiv>\n                  <sc-raw-select value=\"{{ tgtAgId }}\" sc-camel-on-change=\"{{ setTgtAg }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                    <sc-for list=\"{{ agreementOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <div style=\"font-size:11px;color:#8A90A0;margin-top:5px\">{{ tgtAgHint }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Record type<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>Service Request<\u002Foption><option>Incident<\u002Foption><option>Change<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Measure<\u002Fdiv>\n                  <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                    <sc-for list=\"{{ measureOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select><\u002Fdiv>\n                <sc-if value=\"{{ fixedCommit }}\" hint-placeholder-val=\"{{ true }}\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Commitment value<\u002Fdiv><div style=\"display:flex;gap:8px\"><input value=\"2\" style=\"width:70px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px\"><sc-raw-select style=\"flex:1;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>business days<\u002Foption><option>business hours<\u002Foption><option>calendar hours<\u002Foption><\u002Fsc-raw-select><\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Calendar<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>Executive Support Calendar<\u002Foption><option>Business Support Hours<\u002Foption><option>24x7<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Escalation matrix<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>SLA · Enterprise IT<\u002Foption><option>SLA · Executive<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ fixedCommit }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid #F0F2F6\">\n                <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:12px\">Thresholds<\u002Fdiv>\n                <div style=\"display:flex;gap:26px;align-items:center;flex-wrap:wrap\">\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#E8A33D\"><\u002Fspan><span style=\"font-size:12.5px\">Warning<\u002Fspan><input value=\"75\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#D97706\"><\u002Fspan><span style=\"font-size:12.5px\">Management<\u002Fspan><input value=\"90\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#C5221F\"><\u002Fspan><span style=\"font-size:12.5px\">Breach<\u002Fspan><input value=\"100\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ tieredCommit }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;padding:12px 14px;border-radius:8px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">Tiers are on. Commitment value, calendar, thresholds and escalation are set per tier. Everything above is shared by every tier of this Target.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Measurement and clock<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">The method decides which settings this Target needs. Offering scope, record type and what each clock event means are shared by every tier.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n          <sc-for list=\"{{ bzMethods }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\"><div style=\"font-size:12.5px;font-weight:700\">{{ m.label }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:3px;line-height:1.4\">{{ m.hint }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 20px;margin-top:20px;padding-top:18px;border-top:1px solid #F0F2F6\">\n          <sc-for list=\"{{ bzMeasFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">{{ f.k }}<\u002Fdiv><input value=\"{{ f.v }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ bzTimed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Clock and completion events<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A90A0;margin-bottom:6px;line-height:1.5\">Pick from registered workflow events. Each condition carries its reason, authority and audit rule.<\u002Fdiv>\n        <sc-if value=\"{{ bzHasEvtNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 13px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5;margin:8px 0 4px\">{{ bzEvtNote }}<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ bzEvents }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid #F0F2F6;align-items:start\">\n            <div><div style=\"font-size:12.5px;font-weight:700\">{{ e.k }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ e.sub }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n              <sc-raw-select style=\"width:100%;max-width:420px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ e.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ e.tags }}\" as=\"t\" hint-placeholder-count=\"2\"><span style=\"padding:3px 9px;border-radius:5px;background:#F1F3F8;color:#5F6368;font-size:11px;font-weight:600\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px\">\n          <div style=\"padding:11px 13px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:12px;font-weight:700\">Calendar non-working time<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:3px;line-height:1.45\">Comes from the calendar. Never recorded as a pause.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:11px 13px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:12px;font-weight:700\">Explicit pauses<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:3px;line-height:1.45\">Need a permitted reason and are listed on the record.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:11px 13px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:12px;font-weight:700\">Approval waiting<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:3px;line-height:1.45\">Shown apart from fulfillment so the customer journey stays visible.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ bzUntimed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:12px 14px;border-radius:8px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">This method is evaluated over a period, so it has no running clock, pauses or breach event. Results are calculated at the end of each window.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:20px 26px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Enable tiers<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8A90A0;line-height:1.5;text-wrap:pretty\">{{ tierSwitchNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ toggleTier }}\" style=\"{{ tierSw.track }}\"><span style=\"{{ tierSw.knob }}\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tierOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-top:16px;padding:13px 15px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4;flex-wrap:wrap\">\n          <span style=\"padding:3px 9px;border-radius:11px;background:#F0EAFB;color:#5B3AA6;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block\">Tiers<\u002Fspan>\n          <div style=\"flex:1;min-width:200px\"><div style=\"font-size:12.5px;font-weight:600\">{{ tierSummary }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ tierSummarySub }}<\u002Fdiv><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goTiersTab }}\" style=\"padding:7px 13px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap\">Configure tiers →<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\">\n            <div style=\"font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9AA0AE;margin-bottom:4px\">Validation<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:12px;line-height:1.5\">Checks that must pass before this Target can be activated. Updates as you edit.<\u002Fdiv>\n            <sc-for list=\"{{ validations }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:10px;padding:10px 0;border-top:1px solid #F0F2F6\">\n                <span style=\"{{ v.dot }}\"><\u002Fspan>\n                <div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:600\">{{ v.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.5\">{{ v.detail }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n    <div style=\"background:#fff;border:1px dashed #C7CCD8;border-radius:10px;padding:16px 20px\">\n      <div sc-camel-on-click=\"{{ togglePrev }}\" style=\"display:flex;align-items:flex-start;gap:10px;cursor:pointer\"><div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:700\">{{ prevChev }} Test the clock with a sample record<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:3px;line-height:1.45\">Shows the due date your settings would give one example record, so you can spot a wrong calendar or pause before going live.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ prevOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin:14px 0 12px\"><div style=\"font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9AA0AE;flex:1\">Preview<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#FFF4E0;color:#A35C00;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap\">SAMPLE · NOT LIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:12px;color:#5F6368;line-height:1.5\">{{ bzPrev.intro }}<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">{{ bzPrev.big }}<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;margin-bottom:12px\">{{ bzPrev.bigSub }}<\u002Fdiv>\n      <sc-for list=\"{{ bzPrev.rows }}\" as=\"r\" hint-placeholder-count=\"5\"><div style=\"display:flex;gap:12px;padding:9px 0;border-top:1px solid #F0F2F6;font-size:12px\"><div style=\"flex:1;color:#8A90A0\">{{ r.k }}<\u002Fdiv><div style=\"font-weight:600;text-align:right\">{{ r.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:11px;color:#9AA0AE;margin-top:10px;line-height:1.5\">Built from sample records. Live results appear on Target instances and Attainment.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tabTiers }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"{{ guard.style }}\">\n      <span style=\"{{ guard.chip }}\">{{ guard.label }}<\u002Fspan>\n      <div style=\"flex:1;min-width:240px\"><div style=\"font-size:13px;font-weight:700\">{{ guard.title }}<\u002Fdiv><div style=\"font-size:12px;color:#3D424E;margin-top:3px;line-height:1.5;text-wrap:pretty\">{{ guard.detail }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 22px\">\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:10px\">Shared by every tier · set on this Target<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px\">\n        <sc-for list=\"{{ sharedPromise }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"padding:10px 12px;border-radius:7px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:10.5px;color:#8A90A0\">{{ p.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.35\">{{ p.v }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden\">\n      <div style=\"padding:18px 22px;border-bottom:1px solid #E4E7EE;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:240px\"><div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Tiers<\u002Fdiv><div style=\"font-size:12px;color:#8A90A0;line-height:1.5\">Each tier sets its own commitment, calendar, thresholds, escalation, supporting OLA/UC and cost. The active default applies automatically when a rule assigns this Target.<\u002Fdiv><\u002Fdiv>\n        <div sc-camel-on-click=\"{{ addTier }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">+ Add tier<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:34px minmax(150px,1fr) 160px 110px 120px minmax(170px,1fr) 70px 140px 150px 140px 150px;gap:12px;min-width:1480px;padding:10px 22px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n          <div>Default<\u002Fdiv><div>Tier<\u002Fdiv><div>Commitment<\u002Fdiv><div>Thresholds<\u002Fdiv><div>Escalation<\u002Fdiv><div>Supporting OLA / UC<\u002Fdiv><div>Cost<\u002Fdiv><div>Feasibility<\u002Fdiv><div>Capacity<\u002Fdiv><div>Activation<\u002Fdiv><div><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ tierRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ r.openPanel }}\" style=\"display:grid;grid-template-columns:34px minmax(150px,1fr) 160px 110px 120px minmax(170px,1fr) 70px 140px 150px 140px 150px;gap:12px;min-width:1480px;padding:13px 22px;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center;cursor:pointer\" style-hover=\"background:#F6F8FC\">\n            <div sc-camel-on-click=\"{{ r.setDefault }}\" style=\"{{ r.radio }}\"><\u002Fdiv>\n            <div style=\"min-width:0\"><div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap\"><span style=\"font-weight:700;color:#1565C0\">{{ r.tier }}<\u002Fspan><sc-if value=\"{{ r.isDefault }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:2px 7px;border-radius:10px;background:#17213C;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap\">DEFAULT<\u002Fspan><\u002Fsc-if><\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">Tier {{ r.ver }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-weight:600\">{{ r.value }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ r.cal }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"color:#5F6368;font-size:12px\">{{ r.thr }}<\u002Fdiv>\n            <div style=\"color:#5F6368;font-size:12px\">{{ r.esc }}<\u002Fdiv>\n            <div style=\"color:#5F6368;font-size:11.5px;line-height:1.5\">{{ r.links }}<\u002Fdiv>\n            <div style=\"font-weight:700\">{{ r.price }}<\u002Fdiv>\n            <div><span style=\"{{ r.supChip }}\">{{ r.support }}<\u002Fspan><sc-if value=\"{{ r.hasExc }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px;color:#8A90A0;margin-top:4px\">Exception {{ r.excId }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n            <div><span style=\"{{ r.capChip }}\">{{ r.capL }}<\u002Fspan><\u002Fdiv>\n            <div><span style=\"{{ r.actChip }}\">{{ r.activation }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:6px\"><div sc-camel-on-click=\"{{ r.check }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Feasibility<\u002Fdiv><div sc-camel-on-click=\"{{ r.copy }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Copy<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:12px 22px;background:#FAFBFD;font-size:11.5px;color:#8A90A0;line-height:1.5\">Click a tier for its feasibility, selection and approval details. Capacity comes from the tier’s own forecast check; a tier that is not feasible cannot be selected. Pick the default with the radio. Copied or new tiers start as drafts and stay unavailable until their own feasibility check passes.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Manual selection, price and approval<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px\">Authorized stakeholders may change the tier within this Target only. Switching to a different Target is never offered.<\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:minmax(120px,.7fr) 250px 170px minmax(170px,1fr) minmax(140px,.8fr) 210px;gap:14px;min-width:1100px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n          <div>Tier<\u002Fdiv><div>Who may select<\u002Fdiv><div>When selection is allowed<\u002Fdiv><div>Eligibility<\u002Fdiv><div>Additional cost<\u002Fdiv><div>Approval<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ selRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:minmax(120px,.7fr) 250px 170px minmax(170px,1fr) minmax(140px,.8fr) 210px;gap:14px;min-width:1100px;padding:13px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n            <div sc-camel-on-click=\"{{ r.openPanel }}\" style=\"font-weight:700;color:#1565C0;cursor:pointer\">{{ r.tier }}<\u002Fdiv>\n            <div>\n              <sc-if value=\"{{ r.isDefault }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#8A90A0\">Applied automatically<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.notDefault }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ r.roles }}\" as=\"ro\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ ro.toggle }}\" style=\"{{ ro.style }}\">{{ ro.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n              <sc-if value=\"{{ r.isDefault }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#B9BFCC\">—<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.notDefault }}\" hint-placeholder-val=\"{{ true }}\"><sc-raw-select value=\"{{ r.when }}\" sc-camel-on-change=\"{{ r.setWhen }}\" style=\"width:100%;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12px\"><option value=\"At submission\">At submission<\u002Foption><option value=\"Until work starts\">Until work starts<\u002Foption><option value=\"Any time before breach\">Any time before breach<\u002Foption><\u002Fsc-raw-select><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"color:#5F6368;font-size:12px;line-height:1.45\">{{ r.elig }}<\u002Fdiv>\n            <div style=\"color:#3D424E;font-size:12px;line-height:1.45\">{{ r.charge }}<\u002Fdiv>\n            <div>\n              <sc-if value=\"{{ r.isDefault }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#B9BFCC\">—<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.notDefault }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;align-items:center;gap:8px\"><div sc-camel-on-click=\"{{ r.toggleAppr }}\" style=\"{{ r.apprSw.track }}\"><span style=\"{{ r.apprSw.knob }}\"><\u002Fspan><\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12px;font-weight:600\">{{ r.apprLabel }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0\">{{ r.approver }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;padding:11px 14px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">Accepting a cost and requiring approval are separate. The requester accepts a cost at click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;font-size:11.5px;color:#5F6368;line-height:1.45\">{{ bzBranchNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ bzCompTable }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:minmax(170px,1.3fr) 96px 120px minmax(120px,.9fr) minmax(160px,1.1fr) minmax(160px,1.1fr) minmax(140px,1fr);gap:12px;min-width:1080px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n          <div>Supporting Target<\u002Fdiv><div>Status<\u002Fdiv><div>Criticality<\u002Fdiv><div>Activation<\u002Fdiv><div>Predecessor · handover<\u002Fdiv><div>Owner · escalation<\u002Fdiv><div>Alternative path<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ bzLinks }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:minmax(170px,1.3fr) 96px 120px minmax(120px,.9fr) minmax(160px,1.1fr) minmax(160px,1.1fr) minmax(140px,1fr);gap:12px;min-width:1080px;padding:12px 0;border-bottom:1px solid #F0F2F6;font-size:12px;align-items:start\">\n            <div style=\"min-width:0\"><div style=\"display:flex;align-items:center;gap:6px\"><span style=\"{{ l.kindChip }}\">{{ l.kind }}<\u002Fspan><span style=\"font-weight:600;color:#1565C0\">{{ l.ref }}<\u002Fspan><\u002Fdiv><div style=\"font-weight:600;margin-top:4px\">{{ l.name }}<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"{{ l.reqChip }}\">{{ l.req }}<\u002Fspan><\u002Fdiv>\n            <div><div style=\"{{ l.critStyle }}\">{{ l.crit }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px;line-height:1.4\">{{ l.critD }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"color:#3D424E\">{{ l.act }}<\u002Fdiv>\n            <div><div style=\"font-weight:600\">{{ l.pred }} th:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0AE\">{{ g.label }}<\u002Fdiv>\n              <sc-for list=\"{{ g.steps }}\" as=\"s\" hint-placeholder-count=\"1\">\n                <div style=\"{{ s.box }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:7px\"><span style=\"{{ s.kindChip }}\">{{ s.kind }}<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"{{ s.dot }}\"><\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:12.5px;font-weight:700;line-height:1.3\">{{ s.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#5F6368;margin-top:3px\">{{ s.dur }} · {{ s.owner }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ s.cal }}<\u002Fdiv>\n                  <div style=\"font-size:11px;font-weight:600;color:#1565C0;margin-top:6px\">{{ s.ref }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ g.hasHandoff }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px;color:#8A90A0;line-height:1.4\">Handoff · {{ g.handoff }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sup.noStages }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px;border:1px dashed #D5D9E2;border-radius:8px;text-align:center;font-size:12.5px;color:#8A90A0\">No supporting commitments linked yet.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ supVFeas }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Calendar-aware feasibility<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px;line-height:1.5\">Each step is scheduled on its own calendar, with handoffs and vendor cut-offs, then compared with the SLA deadline on {{ sup.slaCal }}. Durations are not simply added together.<\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:minmax(170px,1fr) minmax(150px,1fr) minmax(150px,1fr) 100px 90px;gap:14px;min-width:720px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n          <div>Submitted<\u002Fdiv><div>Supporting path done<\u002Fdiv><div>SLA deadline<\u002Fdiv><div>Margin<\u002Fdiv><div>Result<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sup.scen }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:minmax(170px,1fr) minmax(150px,1fr) minmax(150px,1fr) 100px 90px;gap:14px;min-width:720px;padding:12px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n            <div style=\"font-weight:600\">{{ r.sub }}<\u002Fdiv><div style=\"color:#5F6368\">{{ r.done }}<\u002Fdiv><div style=\"color:#5F6368\">{{ r.due }}<\u002Fdiv><div style=\"{{ r.marginStyle }}\">{{ r.margin }}<\u002Fdiv><div><span style=\"{{ r.chip }}\">{{ r.res }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;padding:10px 13px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\"><strong>Activation · <\u002Fstrong>{{ sup.guard }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Findings<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:8px\">Everything that affects the result, each with the dependency that causes it.<\u002Fdiv>\n      <sc-for list=\"{{ sup.causes }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;gap:12px;padding:12px 0;border-top:1px solid #F0F2F6;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:130px;flex-shrink:0\"><span style=\"padding:3px 9px;border-radius:11px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block\">{{ c.k }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:220px\"><div style=\"font-size:12.5px;font-weight:600\">{{ c.t }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.5\">{{ c.d }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ bzCompIssues }}\" as=\"i\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:12px;padding:12px 0;border-top:1px solid #F0F2F6;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:130px;flex-shrink:0\"><span style=\"{{ i.chip }}\">{{ i.k }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:220px\"><div style=\"font-size:12.5px;font-weight:600\">{{ i.t }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.5\">{{ i.d }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#5F6368;min-width:170px\">Caused by · <span style=\"font-weight:600;color:#1565C0\">{{ i.dep }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ supVDep }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">How dependable the support is<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:14px;line-height:1.5;max-width:780px;text-wrap:pretty\">Who provides each step, the coverage and capacity they have committed, and how they have actually performed. Every confidence rating is based on evidence, dated and explained. It is not a guarantee that the team or supplier will meet the commitment.<\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(190px,1.2fr) 130px 120px 140px minmax(200px,1.2fr);gap:12px;min-width:1100px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n          <div>Team or supplier<\u002Fdiv><div>Coverage · capacity · source<\u002Fdiv><div>Attainment · 90 days<\u002Fdiv><div>Capacity headroom<\u002Fdiv><div>Contingency test<\u002Fdiv><div>Confidence<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ bzRel }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(190px,1.2fr) 130px 120px 140px minmax(200px,1.2fr);gap:12px;min-width:1100px;padding:12px 0;border-bottom:1px solid #F0F2F6;font-size:12px;align-items:start\">\n            <div style=\"min-width:0\"><div style=\"display:flex;align-items:center;gap:6px\"><span style=\"{{ r.kindChip }}\">{{ r.kind }}<\u002Fspan><span style=\"font-weight:600;color:#1565C0\">{{ r.ref }}<\u002Fspan><\u002Fdiv><div style=\"font-weight:600;margin-top:4px\">{{ r.who }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">Owner · {{ r.owner }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"color:#3D424E\">{{ r.cov }}<\u002Fdiv><div style=\"color:#3D424E;margin-top:2px\">{{ r.capA }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:3px\">Source · {{ r.src }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"{{ r.attStyle }}\">{{ r.att }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ r.miss }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"color:#3D424E\">{{ r.head }}<\u002Fdiv>\n            <div style=\"color:#3D424E\">{{ r.test }}<\u002Fdiv>\n            <div><span style=\"{{ r.confChip }}\">{{ r.conf }}<\u002Fspan><div style=\"font-size:11px;color:#5F6368;margin-top:5px;line-height:1.4\">{{ r.why }}<\u002Fdiv><div style=\"font-size:10.5px;color:#9AA0AE;margin-top:3px\">Rated {{ r.dated }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8A90A0;margin-top:12px;line-height:1.5\">The Path view says who does each step. This view says how far to trust them, and what happens if they fail.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\"><div style=\"font-size:14px;font-weight:700\">Resilience<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700;letter-spacing:.02em\">OPTIONAL<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px;line-height:1.5;max-width:760px\">Backup ownership (who takes responsibility) is set apart from backup delivery (who does the work). A backup shows as ready only when it is tested and currently available.<\u002Fdiv>\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:6px\">Backup ownership<\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n      <sc-for list=\"{{ bzBackupOwners }}\" as=\"b\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(150px,1fr) minmax(170px,1fr) minmax(220px,1.2fr);gap:12px;min-width:760px;padding:12px 0;border-top:1px solid #F0F2F6;font-size:12px;align-items:center\">\n          <div><div style=\"font-weight:600\">{{ b.forWhat }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">Primary · {{ b.primary }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;color:#8A90A0\">Backup contact<\u002Fdiv><div style=\"font-weight:600;margin-top:2px\">{{ b.backup }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;color:#8A90A0\">Acknowledgement<\u002Fdiv><div style=\"color:#3D424E;margin-top:2px\">{{ b.ack }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ b.chips }}\" as=\"c\" hint-placeholder-count=\"3\"><span style=\"{{ c.chip }}\">{{ c.l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin:20px 0 10px\">Backup delivery · substitute commitments<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ bzBackupDelivery }}\" as=\"b\" hint-placeholder-count=\"2\">\n          <div style=\"border:1px solid #EDEFF4;border-radius:8px;padding:14px 16px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px\"><div style=\"flex:1;min-width:220px;font-size:12.5px;font-weight:700\">{{ b.title }}<\u002Fdiv><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ b.chips }}\" as=\"c\" hint-placeholder-count=\"3\"><span style=\"{{ c.chip }}\">{{ c.l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px\"><sc-for list=\"{{ b.rows }}\" as=\"r\" hint-placeholder-count=\"6\"><div><div style=\"font-size:10.5px;color:#8A90A0\">{{ r.k }}<\u002Fdiv><div style=\"font-size:12px;font-weight:600;margin-top:2px;line-height:1.4\">{{ r.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin:20px 0 6px\">Technical resilience references<\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n      <sc-for list=\"{{ bzTech }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:minmax(170px,1fr) minmax(240px,1.6fr) minmax(150px,1fr) 150px;gap:12px;min-width:760px;padding:11px 0;border-top:1px solid #F0F2F6;font-size:12px;align-items:center\">\n          <div style=\"font-weight:600\">{{ t.k }}<\u002Fdiv><div style=\"color:#3D424E\">{{ t.v }}<\u002Fdiv><div style=\"color:#5F6368\">Owner · {{ t.owner }}<\u002Fdiv><div><span style=\"{{ t.chip }}\">{{ t.s }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8A90A0;margin-top:12px;line-height:1.5\">SLM records these commitments and their readiness signals. Server failover and load rerouting are done by the infrastructure and orchestration systems. Invoking an alternative never resets the SLA clock or erases breach history.<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tabCap }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <sc-if value=\"{{ capHasTiers }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n      <div style=\"font-size:12px;font-weight:600;color:#5F6368;margin-right:4px\">Assess tier<\u002Fdiv>\n      <sc-for list=\"{{ capTiers }}\" as=\"s\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\"><span style=\"{{ s.dot }}\"><\u002Fspan><span>{{ s.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"{{ cap.style }}\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n        <span style=\"{{ cap.chip }}\">{{ cap.result }}<\u002Fspan>\n        <div style=\"flex:1;min-width:240px\"><div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">{{ cap.title }}<\u002Fdiv><div style=\"font-size:12.5px;color:#3D424E;margin-top:4px;line-height:1.55;text-wrap:pretty\">{{ cap.detail }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:8px\">Assessed 20 Oct 2026 06:00 · 8-week horizon · confidence Medium. The forecast shows whether the commitment can be delivered. It does not change the selected SLA.<\u002Fdiv><\u002Fdiv>\n        <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Reassess<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n        <div style=\"flex:1;min-width:240px\"><div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Forecast demand against available capacity<\u002Fdiv><div style=\"font-size:12px;color:#8A90A0;line-height:1.5\">Laptop Requests a week for the forecast horizon set on the Agreement. Capacity is the lower of technician hours and supplier throughput plus stock.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;font-size:11.5px;color:#5F6368;align-items:center\"><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:7px;border-radius:3px;background:#17213C\"><\u002Fspan>Forecast<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:7px;border-radius:3px;background:#8CCBA8\"><\u002Fspan>Usable capacity<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"display:grid;grid-template-columns:minmax(200px,1.2fr) 80px 90px minmax(200px,1.4fr) 90px 80px 130px;gap:12px;min-width:960px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\"><div>Period · event<\u002Fdiv><div>Forecast<\u002Fdiv><div>Capacity<\u002Fdiv><div><\u002Fdiv><div>Utilisation<\u002Fdiv><div>Shortfall<\u002Fdiv><div>Result<\u002Fdiv><\u002Fdiv>\n        <sc-for list=\"{{ capRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:minmax(200px,1.2fr) 80px 90px minmax(200px,1.4fr) 90px 80px 130px;gap:12px;min-width:960px;padding:12px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n            <div><div style=\"font-weight:600\">{{ r.wk }} · {{ r.dates }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ r.ev }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-weight:700\">{{ r.dStr }}<\u002Fdiv><div style=\"color:#5F6368\">{{ r.cStr }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"{{ r.dBar }}\"><\u002Fdiv><div style=\"{{ r.cBar }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"color:#3D424E\">{{ r.uStr }}<\u002Fdiv><div style=\"{{ r.shStyle }}\">{{ r.shStr }}<\u002Fdiv><div><span style=\"{{ r.chip }}\">{{ r.r }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;padding:14px 16px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\">\n        <div style=\"font-size:12px;font-weight:700\">Where the rows come from<\u002Fdiv>\n        <div style=\"font-size:12px;color:#5F6368;margin-top:3px;line-height:1.5;max-width:780px\">One row per week in the forecast horizon. The forecast figure is built from 18 months of Request history plus the HR joiner pipeline. A week is labelled with an event when it overlaps a busy period, and the event’s uplift is applied to that week.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 22px;margin-top:12px\">\n          <div><div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:6px\">From the Agreement · shared<\u002Fdiv><sc-for list=\"{{ capEvShared }}\" as=\"e\" hint-placeholder-count=\"2\"><div style=\"font-size:12px;padding:5px 0;border-top:1px solid #F0F2F6\"><b>{{ e.name }}<\u002Fb> <span style=\"color:#8A90A0\">· {{ e.when }} · {{ e.up }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><div sc-camel-on-click=\"{{ capGoAgreement }}\" style=\"font-size:11.5px;font-weight:600;color:#1565C0;cursor:pointer;margin-top:6px\">Edit in Agreement → Service assurance<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:6px\">This Target only<\u002Fdiv>\n            <sc-if value=\"{{ capEvNone }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12px;color:#8A90A0;padding:5px 0\">None. Add one for demand only this Target sees, such as a laptop refresh wave.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ capEvOwn }}\" as=\"e\" hint-placeholder-count=\"1\"><div style=\"display:flex;gap:10px;font-size:12px;padding:5px 0;border-top:1px solid #F0F2F6\"><div style=\"flex:1\"><b>{{ e.name }}<\u002Fb> <span style=\"color:#8A90A0\">· {{ e.when }} · {{ e.up }}<\u002Fspan><\u002Fdiv><span sc-camel-on-click=\"{{ e.remove }}\" style=\"font-size:11.5px;font-weight:600;color:#C62828;cursor:pointer\">Remove<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <sc-if value=\"{{ capEvFormOff }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ capEvOpen }}\" style=\"font-size:11.5px;font-weight:600;color:#1565C0;cursor:pointer;margin-top:6px\">+ Add event for this Target<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ capEvFormOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px\">\n              <input value=\"{{ capEvD.name }}\" sc-camel-on-change=\"{{ capEvSet.name }}\" placeholder=\"Event name\" style=\"padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px\">\n              <input value=\"{{ capEvD.when }}\" sc-camel-on-change=\"{{ capEvSet.when }}\" placeholder=\"e.g. Wk 49–50\" style=\"padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px\">\n              <sc-raw-select value=\"{{ capEvD.up }}\" sc-camel-on-change=\"{{ capEvSet.up }}\" style=\"padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px;background:#fff\"><option value=\"1.2× demand\">1.2× demand<\u002Foption><option value=\"1.5× demand\">1.5× demand<\u002Foption><option value=\"2× demand\">2× demand<\u002Foption><\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:8px\"><div sc-camel-on-click=\"{{ capEvCancel }}\" style=\"padding:6px 12px;border:1px solid #D5D9E2;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#fff\">Cancel<\u002Fdiv><div sc-camel-on-click=\"{{ capEvSave }}\" style=\"padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#17213C;color:#fff\">Add event<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#9AA0AE;margin-top:10px\">New events apply at the next Reassess.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1 1 520px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Available supply<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A90A0;margin-bottom:8px;line-height:1.5\">Each assumption shows its source and how fresh it is. Supplier rows come from the capacity schedule in each UC linked under Supporting commitments, so they only appear when a UC is involved.<\u002Fdiv>\n        <sc-for list=\"{{ capSupply }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:12px;padding:11px 0;border-top:1px solid #F0F2F6;align-items:flex-start;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:220px\"><div style=\"font-size:12.5px;font-weight:600\">{{ s.k }}<\u002Fdiv><div style=\"font-size:12px;color:#3D424E;margin-top:2px\">{{ s.a }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:3px\">{{ s.src }} · {{ s.fr }}<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"{{ s.chip }}\">{{ s.c }} confidence<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 340px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Workforce<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">Staffing assumptions behind the capacity figure.<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n          <div style=\"flex:1;padding:12px 14px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:10.5px;color:#8A90A0\">Technicians needed at peak<\u002Fdiv><div style=\"{{ capNeedStyle }}\">{{ capNeed }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;padding:12px 14px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4\"><div style=\"font-size:10.5px;color:#8A90A0\">Rostered<\u002Fdiv><div style=\"font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ capAvail }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:#3D424E;margin-bottom:6px\">{{ capNeedNote }}<\u002Fdiv>\n        <sc-for list=\"{{ capWork }}\" as=\"w\" hint-placeholder-count=\"6\"><div style=\"display:flex;gap:12px;padding:8px 0;border-top:1px solid #F0F2F6;font-size:12px\"><div style=\"width:130px;flex-shrink:0;color:#8A90A0\">{{ w.k }}<\u002Fdiv><div style=\"flex:1;min-width:0;font-weight:600;line-height:1.4\">{{ w.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <div style=\"font-size:11px;color:#9AA0AE;margin-top:10px;line-height:1.5\">Roster and allocation come from workforce management (WFM sync, 20 Oct 06:00). Assigning a team name alone never makes a Target feasible.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Scenarios<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:6px;line-height:1.5;max-width:780px\">Suggested by the system from what limits capacity above. Each one changes a single input: people, hours, supplier throughput or an alternative route from a linked UC. Toggle one to see whether it closes the gap. Nothing is changed for real.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px\">\n        <sc-for list=\"{{ capLevers }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #F0F2F6\"><div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ c.label }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ c.d }}<\u002Fdiv><\u002Fdiv><div sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.sw.track }}\"><span style=\"{{ c.sw.knob }}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:12px;padding:10px 13px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">{{ capLevNote }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Volume limit for this Target<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px;line-height:1.5\">Set on this Target only. Say whether the limit is in the contract, and exactly what happens to demand above it.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px\">\n        <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Limit<\u002Fdiv><input value=\"{{ capLim.limit }}\" sc-camel-on-change=\"{{ capLim.setLimit }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><\u002Fdiv>\n        <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Period<\u002Fdiv><sc-raw-select value=\"{{ capLim.period }}\" sc-camel-on-change=\"{{ capLim.setPeriod }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option value=\"Per business day\">Per business day<\u002Foption><option value=\"Per week\">Per week<\u002Foption><option value=\"Per month\">Per month<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Type<\u002Fdiv><sc-raw-select value=\"{{ capLim.type }}\" sc-camel-on-change=\"{{ capLim.setType }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option value=\"Contractual\">Contractual<\u002Foption><option value=\"Planning assumption\">Planning assumption<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8A90A0;margin-top:6px\">{{ capLim.typeNote }}<\u002Fdiv>\n      <div style=\"margin-top:14px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">When demand exceeds the limit<\u002Fdiv><sc-raw-select value=\"{{ capLim.excess }}\" sc-camel-on-change=\"{{ capLim.setExcess }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ capExcessOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <sc-if value=\"{{ capLimWarn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;padding:10px 13px;border-radius:7px;background:#FDF1F0;border:1px solid #F3C7C3;color:#A31816;font-size:12px;line-height:1.5\">A contractual limit needs defined excess handling. Readiness is blocked until it has one.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F6\"><div style=\"{{ capLim.fcStyle }}\">{{ capLim.fc }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8A90A0;margin-top:8px;line-height:1.5\">Reaching the limit never removes SLA coverage, defers the clock or rejects Requests on its own. The chosen handling is shown on the Request.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tabReady }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <sc-if value=\"{{ capHasTiers }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n      <div style=\"font-size:12px;font-weight:600;color:#5F6368;margin-right:4px\">Assess tier<\u002Fdiv>\n      <sc-for list=\"{{ capTiers }}\" as=\"s\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\"><span style=\"{{ s.dot }}\"><\u002Fspan><span>{{ s.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"{{ rd.style }}\">\n      <span style=\"{{ rd.chip }}\">{{ rd.label }}<\u002Fspan>\n      <div style=\"flex:1;min-width:240px\"><div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">{{ rd.title }}<\u002Fdiv><div style=\"font-size:12.5px;color:#3D424E;margin-top:4px;line-height:1.55;text-wrap:pretty\">{{ rd.detail }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Readiness summary<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:8px;line-height:1.5;max-width:780px\">Generated automatically for {{ rdTarget }}. Every Target with service assurance gets the same eight checks. Each one reads its result from another tab (Capacity, Supporting commitments or the Agreement), and the evidence column says where. To change a result, fix it at the source.<\u002Fdiv>\n      <sc-for list=\"{{ rdItems }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;gap:14px;padding:13px 0;border-top:1px solid #F0F2F6;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:84px;flex-shrink:0\"><span style=\"{{ r.chip }}\">{{ r.sl }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:240px\"><div style=\"font-size:11px;color:#8A90A0\">{{ r.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:2px\">{{ r.t }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6368;margin-top:3px;line-height:1.5\">{{ r.d }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"width:200px;font-size:11px;color:#8A90A0;line-height:1.4\">Evidence · {{ r.ev }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Risk acceptance<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A90A0;margin-bottom:14px;line-height:1.5\">Some checks are amber: not blocking, but a real risk. Risk acceptance is a named owner formally agreeing to go live anyway, with a date to review it. It is recorded in the audit trail. The risk stays amber and visible. Red items cannot be accepted.<\u002Fdiv>\n      <sc-if value=\"{{ rdBlocked }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:11px 14px;border-radius:7px;background:#FDF1F0;border:1px solid #F3C7C3;color:#A31816;font-size:12px;line-height:1.5\">Blocking items can’t be accepted as risk: {{ rdBlockList }}. Fix them first.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ rdNeeds }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;color:#3D424E;margin-bottom:12px\">Risks to accept · <strong>{{ rdRisks }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:240px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Accountable owner<\u002Fdiv><sc-raw-select value=\"{{ rdOwner }}\" sc-camel-on-change=\"{{ setRdOwner }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><sc-for list=\"{{ rdOwners }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Review by<\u002Fdiv><input value=\"30 Nov 2026\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff;width:140px\"><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ rdAccept }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Record acceptance<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rdAccepted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:#FFF8EC;border:1px solid #F2DFBE\">\n          <div style=\"flex:1;min-width:220px;font-size:12px;color:#5F4200;line-height:1.5\"><strong>Accepted by {{ rdAcc.by }}<\u002Fstrong> · {{ rdAcc.on }} · review by {{ rdAcc.until }}<div style=\"margin-top:2px\">{{ rdRisks }}<\u002Fdiv><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ rdWithdraw }}\" style=\"font-size:12px;font-weight:600;color:#A31816;cursor:pointer;white-space:nowrap\">Withdraw<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rdReady }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#5F6368\">No risks to accept.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tabRules }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Applicability rules · level 3<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8A90A0\">{{ tgtRulesDesc }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ addRule }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">+ Add rule<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"display:grid;grid-template-columns:92px minmax(240px,1fr) 80px 90px 96px 70px;gap:12px;min-width:7 l.name }}<\u002Fdiv>\n                <span style=\"padding:2px 9px;border-radius:10px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700\">v{{ cal.version }}<\u002Fspan>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0\">{{ cal.tz }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:10px\">Weekly coverage<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px\">\n                <sc-for list=\"{{ cal.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ d.style }}\">\n                    <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75\">{{ d.day }}<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:600;margin-top:6px\">{{ d.hours }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:12px\">Holidays &amp; blackouts<\u002Fdiv>\n                <sc-for list=\"{{ cal.holidays }}\" as=\"h\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F0F2F6\">\n                    <div style=\"width:78px;font-size:12px;color:#8A90A0\">{{ h.date }}<\u002Fdiv>\n                    <div style=\"flex:1;font-size:12.5px;font-weight:600\">{{ h.name }}<\u002Fdiv>\n                    <span style=\"{{ h.chip }}\">{{ h.type }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:#FFF9EC;border:1px solid #F0DCB0;border-radius:10px;padding:22px 24px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                  <span style=\"width:8px;height:8px;border-radius:4px;background:#C77700\"><\u002Fspan>\n                  <div style=\"font-size:14px;font-weight:700;color:#7A4B00\">Coverage feasibility risk<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7A4B00;line-height:1.6\">Service Desk OLA triage of 30 minutes uses <strong>Business Hours Mon–Fri<\u002Fstrong>, but the linked SLA commits to a 1-hour response on <strong>24x7<\u002Fstrong>. Out-of-hours requests cannot be supported.<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:16px\">\n                  <div style=\"padding:7px 13px;border-radius:6px;background:#17213C;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Raise remediation<\u002Fdiv>\n                  <div style=\"padding:7px 13px;border:1px solid #D9C48C;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:#7A4B00;cursor:pointer\">Record exception<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ ESCALATION MATRIX ============ -->\n      <sc-if value=\"{{ isEsc }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1160px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:220px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Escalation matrix<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">One framework, separately configurable per commitment type. Ownership stays distinct even when impact cascades.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-shrink:0\">\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">+ Add level<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Save matrix<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:4px;background:#EDEFF4;border-radius:8px;padding:4px;width:fit-content;margin-bottom:20px\">\n          <sc-for list=\"{{ escTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow-x:auto\">\n          <div style=\"display:grid;grid-template-columns:150px minmax(230px,1fr) 190px 110px 30px;gap:16px;min-width:860px;padding:12px 22px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n            <div>Level<\u002Fdiv><div>Trigger<\u002Fdiv><div>Primary recipient<\u002Fdiv><div>Clock<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ escRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div>\n              <div sc-camel-on-click=\"{{ r.toggle }}\" style=\"{{ r.rowStyle }}\">\n                <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"{{ r.dot }}\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:700\">{{ r.level }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#5F6368\">{{ r.trigger }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:600\">{{ r.recipient }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#5F6368\">{{ r.clock }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#9AA0AE;text-align:right\">{{ r.caret }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:20px 22px 24px;min-width:860px;background:#FAFBFD;border-bottom:1px solid #E4E7EE\">\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 20px\">\n                    <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Primary recipient<\u002Fdiv>\n                      <sc-raw-select value=\"{{ r.recipient }}\" sc-camel-on-change=\"{{ r.setRecipient }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\">\n                        <sc-for list=\"{{ recipientOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select><\u002Fdiv>\n                    <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Backup recipient<\u002Fdiv>\n                      <sc-raw-select value=\"{{ r.backup }}\" sc-camel-on-change=\"{{ r.setBackup }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\">\n                        <sc-for list=\"{{ recipientOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select><\u002Fdiv>\n                    <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Channel<\u002Fdiv>\n                      <sc-raw-select value=\"{{ r.channel }}\" sc-camel-on-change=\"{{ r.setChannel }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D
