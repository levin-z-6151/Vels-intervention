or list=\"{{ cascade }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A90A0;margin-top:14px;line-height:1.6\">A UC breach does not create a customer-facing escalation if the internal team can still absorb the impact and meet the SLA.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:20px 24px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Business conditions and coverage · {{ bzEscType }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px;line-height:1.5\">Applies to every level above. Adds impact conditions, coverage calendars, extra triggers and authorized contingency actions.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n            <sc-for list=\"{{ bzEscSections }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"border:1px solid #EDEFF4;border-radius:8px;padding:14px 16px\">\n                <div style=\"font-size:12.5px;font-weight:700;margin-bottom:6px\">{{ s.title }}<\u002Fdiv>\n                <sc-for list=\"{{ s.rows }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid #F0F2F6;font-size:12px\"><div style=\"color:#8A90A0\">{{ r.k }}<\u002Fdiv><div style=\"font-weight:600;line-height:1.4\">{{ r.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding:10px 13px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">{{ bzEscVendorNote }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ IMPROVEMENT ============ -->\n      <sc-if value=\"{{ isImprove }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1320px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:240px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Improvement<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368;max-width:760px;line-height:1.5;text-wrap:pretty\">Corrective work, support revalidation and review actions across every Agreement. Escalation manages the immediate breach; an Improvement tracks the underlying or follow-up work.<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ impNew }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0\">+ New improvement<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px\">\n          <sc-for list=\"{{ impTypes }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"{{ t.chip }}\">{{ t.label }}<\u002Fspan><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1\">{{ t.open }}<\u002Fspan><span style=\"font-size:11px;color:#8A90A0\">open<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12px;color:#5F6368;margin-top:9px;line-height:1.5\">{{ t.d }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8A90A0;margin-top:6px;line-height:1.45\">Done when {{ t.done }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden\">\n          <div style=\"padding:12px 16px;border-bottom:1px solid #E4E7EE;display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n            <span style=\"font-size:11.5px;color:#8A90A0;font-weight:600\">Filter<\u002Fspan>\n            <sc-for list=\"{{ impFilters }}\" as=\"fl\" hint-placeholder-count=\"6\">\n              <sc-raw-select value=\"{{ fl.val }}\" sc-camel-on-change=\"{{ fl.set }}\" style=\"padding:7px 10px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12px;min-width:150px\"><sc-for list=\"{{ fl.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n            <\u002Fsc-for>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <span style=\"font-size:11.5px;color:#8A90A0\">{{ impCount }}<\u002Fspan>\n            <sc-if value=\"{{ impFiltered }}\" hint-placeholder-val=\"{{ false }}\"><span sc-camel-on-click=\"{{ impClear }}\" style=\"font-size:12px;font-weight:600;color:#1565C0;cursor:pointer\">Clear<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"overflow-x:auto\">\n            <div style=\"display:grid;grid-template-columns:minmax(240px,1.6fr) 170px minmax(170px,1fr) minmax(210px,1.2fr) 110px 70px 96px 120px 100px;gap:12px;min-width:1340px;padding:11px 18px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n              <div>Improvement<\u002Fdiv><div>Type<\u002Fdiv><div>Source<\u002Fdiv><div>Linked records<\u002Fdiv><div>Owner<\u002Fdiv><div>Priority<\u002Fdiv><div>Due<\u002Fdiv><div>Status<\u002Fdiv><div>Next review<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ impRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\">\n                <div style=\"min-width:0\"><div style=\"font-size:11px;color:#8A90A0\">{{ r.id }}<\u002Fdiv><div style=\"font-weight:600;line-height:1.4;margin-top:2px\">{{ r.title }}<\u002Fdiv><\u002Fdiv>\n                <div><span style=\"{{ r.typeChip }}\">{{ r.typeLabel }}<\u002Fspan><\u002Fdiv>\n                <div style=\"color:#5F6368;font-size:12px;line-height:1.45\">{{ r.src }}<\u002Fdiv>\n                <div style=\"display:flex;gap:4px;flex-wrap:wrap\"><sc-for list=\"{{ r.links }}\" as=\"l\" hint-placeholder-count=\"2\"><span style=\"padding:2px 7px;border-radius:4px;background:#F1F3F8;color:#5F6368;font-size:10.5px;font-weight:600\">{{ l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"font-size:12px\">{{ r.owner }}<\u002Fdiv>\n                <div style=\"{{ r.prioStyle }}\">{{ r.priority }}<\u002Fdiv>\n                <div style=\"font-size:12px\">{{ r.due }}<\u002Fdiv>\n                <div><span style=\"{{ r.statusChip }}\">{{ r.status }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px;color:#5F6368\">{{ r.next }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ impEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:28px 18px;font-size:12.5px;color:#8A90A0;text-align:center\">No improvements match these filters.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ impHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px;background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden\">\n          <div style=\"padding:20px 24px;border-bottom:1px solid #F0F2F6;display:flex;gap:16px;align-items:flex-start\">\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px\"><span style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">{{ imp.id }}<\u002Fspan><span style=\"{{ imp.typeChip }}\">{{ imp.typeLabel }}<\u002Fspan><span style=\"{{ imp.statusChip }}\">{{ imp.status }}<\u002Fspan><sc-for list=\"{{ imp.tags }}\" as=\"t\" hint-placeholder-count=\"1\"><span style=\"padding:2px 8px;border-radius:4px;border:1px solid #E4E7EE;color:#5F6368;font-size:10.5px;font-weight:600\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:700;letter-spacing:-.01em\">{{ imp.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5F6368;margin-top:5px;line-height:1.55;max-width:820px;text-wrap:pretty\">{{ imp.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ impDeselect }}\" style=\"width:30px;height:30px;border-radius:6px;border:1px solid #D5D9E2;display:flex;align-items:center;justify-content:center;font-size:16px;color:#5F6368;cursor:pointer;flex-shrink:0\">×<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 24px;background:#FAFBFD;border-bottom:1px solid #F0F2F6;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px\">\n            <sc-for list=\"{{ imp.shared }}\" as=\"f\" hint-placeholder-count=\"6\"><div><div style=\"font-size:10.5px;color:#8A90A0\">{{ f.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.4\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:14px 24px;border-bottom:1px solid #F0F2F6;display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n            <span style=\"font-size:11px;font-weight:600;color:#5F6368;margin-right:4px\">Linked records<\u002Fspan>\n            <sc-for list=\"{{ imp.linked }}\" as=\"l\" hint-placeholder-count=\"4\"><span style=\"display:inline-flex;gap:6px;padding:4px 10px;border-radius:5px;background:#F1F3F8;font-size:11.5px\"><span style=\"color:#8A90A0\">{{ l.k }}<\u002Fspan><span style=\"font-weight:600;color:#3D424E\">{{ l.v }}<\u002Fspan><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 24px\">\n            <sc-if value=\"{{ impIsCor }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:3px\">Corrective workflow<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:16px\">Actions completed and effectiveness are tracked separately. Completed actions do not mean the issue is fixed.<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px\"><sc-for list=\"{{ imp.corFacts }}\" as=\"f\" hint-placeholder-count=\"5\"><div><div style=\"font-size:10.5px;color:#8A90A0\">{{ f.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.45\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px\">\n                <div style=\"border:1px solid #E4E7EE;border-radius:8px;padding:16px 18px\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px\"><div style=\"flex:1;font-size:13px;font-weight:700\">Actions completed<\u002Fdiv><div style=\"font-size:12px;font-weight:700\">{{ imp.actProg }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"height:6px;border-radius:3px;background:#EEF0F5;overflow:hidden;margin:8px 0 6px\"><div style=\"{{ imp.actBar }}\"><\u002Fdiv><\u002Fdiv>\n                  <sc-for list=\"{{ imp.acts }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ a.toggle }}\" style=\"display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid #F0F2F6;cursor:pointer\">\n                      <span style=\"{{ a.box }}\">{{ a.mark }}<\u002Fspan>\n                      <div style=\"flex:1;min-width:0\"><div style=\"{{ a.txt }}\">{{ a.t }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:1px\">{{ a.who }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ imp.noActs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#8A90A0;padding:8px 0\">No actions logged yet.<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #E4E7EE;border-radius:8px;padding:16px 18px\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px\"><div style=\"flex:1;font-size:13px;font-weight:700\">Effectiveness<\u002Fdiv><div style=\"{{ imp.effStyle }}\">{{ imp.effLabel }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"height:6px;border-radius:3px;background:#EEF0F5;overflow:hidden;margin:8px 0 12px\"><div style=\"{{ imp.effBar }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:12px;color:#5F6368;line-height:1.55\">{{ imp.effNote }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px;padding:13px 16px;border-radius:8px;background:#F6F8FC;border:1px solid #DCE3F0;display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:240px;font-size:12px;color:#33405E;line-height:1.5\">{{ imp.closeText }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ imp.closeGo }}\" style=\"{{ imp.closeBtnStyle }}\">{{ imp.closeBtn }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ impIsRev }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:3px\">Support revalidation<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">Reassesses each published Target tier that depends on the changed record.<\u002Fdiv>\n              <div style=\"padding:13px 16px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4;margin-bottom:16px\"><div style=\"font-size:11px;color:#8A90A0\">Changed dependency · {{ imp.rvWhen }}<\u002Fdiv><div style=\"font-size:13px;font-weight:700;margin-top:3px\">{{ imp.rvChange }}<\u002Fdiv><div style=\"font-size:12px;color:#5F6368;margin-top:2px\">{{ imp.rvWhat }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:6px\">Affected Targets / tiers<\u002Fdiv>\n              <div style=\"border:1px solid #E4E7EE;border-radius:8px;overflow-x:auto;margin-bottom:18px\">\n                <sc-for list=\"{{ imp.rvTargets }}\" as=\"x\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:minmax(200px,1fr) 240px minmax(220px,1.3fr);gap:14px;min-width:700px;padding:12px 16px;border-bottom:1px solid #F0F2F6;align-items:center\">\n                    <div><div sc-camel-on-click=\"{{ x.open }}\" style=\"font-size:12.5px;font-weight:600;color:#1565C0;cursor:pointer\">{{ x.name }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ x.id }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"{{ x.wasChip }}\">{{ x.was }}<\u002Fspan><span style=\"color:#9AA0AE\">→<\u002Fspan><span style=\"{{ x.nowChip }}\">{{ x.now }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:12px;color:#5F6368;line-height:1.5\">{{ x.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px\"><sc-for list=\"{{ imp.rvFacts }}\" as=\"f\" hint-placeholder-count=\"5\"><div><div style=\"font-size:10.5px;color:#8A90A0\">{{ f.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.45\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:20px 0 6px\">Disposition · required to close<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px\"><sc-for list=\"{{ imp.disps }}\" as=\"o\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\"><span style=\"{{ o.radio }}\"><\u002Fspan><div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ o.label }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.45\">{{ o.d }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"margin-top:14px;padding:11px 14px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\"><strong>Live records are not rewritten.<\u002Fstrong> Target Instances already running keep the commitment they started with. The disposition applies to new instances only.<\u002Fdiv>\n              <div style=\"margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:240px;font-size:12px;color:#5F6368;line-height:1.5\">{{ imp.rvState }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ imp.dispGo }}\" style=\"{{ imp.dispBtnStyle }}\">{{ imp.dispBtn }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ impIsRa }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:3px\">Review action<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:14px\">Tracks work agreed in a review and reports the result back to it.<\u002Fdiv>\n              <div style=\"padding:13px 16px;border-radius:8px;background:#FAFBFD;border:1px solid #EDEFF4;margin-bottom:16px\"><div style=\"font-size:11px;color:#8A90A0\">Source review · {{ imp.raReview }}<\u002Fdiv><div style=\"font-size:12.5px;margin-top:4px;line-height:1.55\">{{ imp.raDecision }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px\"><sc-for list=\"{{ imp.raFacts }}\" as=\"f\" hint-placeholder-count=\"5\"><div><div style=\"font-size:10.5px;color:#8A90A0\">{{ f.k }}<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.45\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin:20px 0 6px\">Completion decision<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px\"><sc-for list=\"{{ imp.raOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\"><span style=\"{{ o.radio }}\"><\u002Fspan><div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600\">{{ o.label }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.45\">{{ o.d }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"margin-top:14px;padding:11px 14px;border-radius:7px;background:#F6F8FC;border:1px solid #DCE3F0;font-size:12px;color:#33405E;line-height:1.5\">{{ imp.raBack }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"padding:20px 24px;border-top:1px solid #F0F2F6;background:#FAFBFD;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px\">\n            <div>\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:8px\">Comments<\u002Fdiv>\n              <sc-for list=\"{{ imp.comments }}\" as=\"c\" hint-placeholder-count=\"1\"><div style=\"padding:9px 0;border-top:1px solid #EDEFF4\"><div style=\"font-size:11px;color:#8A90A0\">{{ c.who }} · {{ c.when }}<\u002Fdiv><div style=\"font-size:12px;margin-top:3px;line-height:1.5\">{{ c.msg }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n              <textarea rows=\"2\" value=\"{{ impDraft }}\" sc-camel-on-change=\"{{ setImpDraft }}\" placeholder=\"Add a comment\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;font-family:inherit;resize:vertical;margin-top:8px;background:#fff\"><\u002Ftextarea>\n              <div style=\"display:flex;justify-content:flex-end;margin-top:6px\"><div sc-camel-on-click=\"{{ addImpComment }}\" style=\"padding:6px 12px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer\">Add comment<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:8px\">Evidence<\u002Fdiv>\n              <sc-for list=\"{{ imp.evidence }}\" as=\"e\" hint-placeholder-count=\"2\"><div style=\"padding:9px 0;border-top:1px solid #EDEFF4\"><div style=\"font-size:12px;font-weight:600;color:#1565C0\">{{ e.name }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ e.meta }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:8px\">Audit history<\u002Fdiv>\n              <sc-for list=\"{{ imp.audit }}\" as=\"a\" hint-placeholder-count=\"3\"><div style=\"padding:9px 0;border-top:1px solid #EDEFF4\"><div style=\"font-size:11px;color:#8A90A0\">{{ a.when }} · {{ a.who }}<\u002Fdiv><div style=\"font-size:12px;margin-top:3px;line-height:1.45\">{{ a.what }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ BUSINESS OUTCOMES ============ -->\n      <sc-if value=\"{{ isOutcomes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1320px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:2 rsor:pointer;white-space:nowrap\">Formalize as Target →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ ATTAINMENT ============ -->\n      <sc-if value=\"{{ isAttain }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1160px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:240px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Attainment by target and tier<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">Enterprise IT Support v3 · last 30 days. Attainment is reported per Target, with a breakdown by tier where the Target has tiers.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:4px\"><span style=\"font-size:12.5px;font-weight:600\">Tier breakdown<\u002Fspan><div sc-camel-on-click=\"{{ toggleRollup }}\" style=\"{{ rollSw.track }}\"><span style=\"{{ rollSw.knob }}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow-x:auto\">\n          <div style=\"display:grid;grid-template-columns:minmax(240px,1.6fr) 130px 90px 80px 90px 100px minmax(140px,1fr);gap:12px;min-width:960px;padding:12px 20px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n            <div>Target<\u002Fdiv><div>Tier<\u002Fdiv><div>Instances<\u002Fdiv><div>Met<\u002Fdiv><div>Breached<\u002Fdiv><div>Attainment<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ attainRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"{{ r.rowStyle }}\">\n              <div style=\"{{ r.nameStyle }}\"><div>{{ r.name }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;font-weight:400;margin-top:2px\">{{ r.sub }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"color:#5F6368\">{{ r.tier }}<\u002Fdiv><div>{{ r.instances }}<\u002Fdiv><div>{{ r.met }}<\u002Fdiv><div>{{ r.breached }}<\u002Fdiv>\n              <div style=\"{{ r.pctStyle }}\">{{ r.pct }}<\u002Fdiv>\n              <div style=\"height:6px;border-radius:3px;background:#EEF0F5;overflow:hidden\"><div style=\"{{ r.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#8A90A0;margin-top:12px;line-height:1.5\">Target totals include every tier. Supplier escalation and SLA/OLA/UC ownership views are unchanged under Agreements and the Supplier portal.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ VARIANT MIGRATION ============ -->\n      <sc-if value=\"{{ isMigrate }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1320px\">\n        <div style=\"margin-bottom:20px\">\n          <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Migration review<\u002Fh1>\n          <div style=\"font-size:13px;color:#5F6368\">Legacy SLA Variants and full-target tiers from the previous design are consolidated as tiers under their parent Target. Rules are redirected to the parent and every tier is revalidated before publication.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:18px\">\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\"><div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap\"><div style=\"font-size:13.5px;font-weight:700\">SLA Variants<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#FDECEA;color:#A31816;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block\">Being removed<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#5F6368;line-height:1.5\">Value overrides on a Target. Each one becomes a tier of that Target with its own commitment and supporting OLA/UC. New SLA Variants can no longer be created.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\"><div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap\"><div style=\"font-size:13.5px;font-weight:700\">Offering Variants<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#E6F4EC;color:#1E6F47;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block\">Unchanged<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#5F6368;line-height:1.5\">Catalog choices such as laptop model or storage size. They stay valid and can still be used in applicability rule conditions.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px\"><div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap\"><div style=\"font-size:13.5px;font-weight:700\">Historical instances<\u002Fdiv><span style=\"padding:3px 9px;border-radius:11px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block\">Preserved<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#5F6368;line-height:1.5\">Instances keep their original Target and variant identifiers, such as TGT-1042, and stay read-only. Nothing is rewritten.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow-x:auto\">\n          <div style=\"padding:16px 20px;border-bottom:1px solid #E4E7EE\"><div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">Migration review<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ migSummary }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.3fr) minmax(180px,1fr) 140px 130px 170px 120px;gap:12px;min-width:1180px;padding:12px 20px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n            <div>Source<\u002Fdiv><div>Consolidated into<\u002Fdiv><div>Rules · dependencies<\u002Fdiv><div>Validation<\u002Fdiv><div>History<\u002Fdiv><div>Status<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ migRows }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.3fr) minmax(180px,1fr) 140px 130px 170px 120px;gap:12px;min-width:1180px;padding:14px 20px;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n              <div><div style=\"font-weight:600\">{{ m.legacy }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ m.parent }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-weight:600\">{{ m.proposed }}<\u002Fdiv><div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">{{ m.commit }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"color:#5F6368;font-size:12px;line-height:1.45\">{{ m.deps }}<\u002Fdiv>\n              <div><span style=\"{{ m.resChip }}\">{{ m.result }}<\u002Fspan><sc-if value=\"{{ m.hasExc }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px;color:#8A90A0;margin-top:4px\">{{ m.exc }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n              <div style=\"color:#5F6368;font-size:12px\">{{ m.hist }}<\u002Fdiv>\n              <div><span style=\"{{ m.statusChip }}\">{{ m.status }}<\u002Fspan><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.btnStyle }}
