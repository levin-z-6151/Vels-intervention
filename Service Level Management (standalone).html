document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 700;\n  font-display: swap;\n  src: url(\"efc21d95-6c1d-4fcb-b187-14207595b790\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"0abe6096-203d-468a-80d9-e3f0b3c5dddb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"1c9c5c20-6aa0-4c5e-be52-6b778e7896f0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;padding:0;height:100%}\nbody{font-family:'Lato','Helvetica Neue',Arial,sans-serif;font-size:13px;color:#1A1A1A;background:#F4F5F9;-webkit-font-smoothing:antialiased}\n*,*::before,*::after{box-sizing:border-box}\na{color:#1565C0;text-decoration:none}\na:hover{color:#0D47A1;text-decoration:underline}\ninput,select,textarea,button{font-family:inherit;font-size:inherit}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#D7DBE3;border-radius:6px;border:3px solid transparent;background-clip:content-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#F4F5F9\">\n  <sc-if value=\"{{ drillOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDrill }}\" style=\"position:fixed;inset:0;background:rgba(23,33,60,.32);z-index:60\"><\u002Fdiv>\n  <div style=\"position:fixed;top:0;right:0;bottom:0;width:min(700px,100vw);background:#fff;z-index:61;box-shadow:-12px 0 40px rgba(23,33,60,.2);display:flex;flex-direction:column\">\n    <div style=\"padding:22px 24px 18px;border-bottom:1px solid #E4E7EE;display:flex;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:6px\">{{ drill.kicker }}<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:700;letter-spacing:-.02em\">{{ drill.title }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5F6368;margin-top:4px;line-height:1.5;text-wrap:pretty\">{{ drill.sub }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ closeDrill }}\" style=\"width:32px;height:32px;border-radius:6px;border:1px solid #D5D9E2;display:flex;align-items:center;justify-content:center;font-size:17px;color:#5F6368;cursor:pointer;flex-shrink:0\" style-hover=\"border-color:#17213C\">×<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ drill.hasStats }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:#E4E7EE;border-bottom:1px solid #E4E7EE\">\n      <sc-for list=\"{{ drill.stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;padding:14px 24px\"><div style=\"font-size:11px;color:#8A90A0;font-weight:600\">{{ s.label }}<\u002Fdiv><div style=\"{{ s.style }}\">{{ s.value }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"flex:1;overflow:auto\">\n      <div style=\"{{ drill.headStyle }}\">\n        <sc-for list=\"{{ drill.cols }}\" as=\"c\" hint-placeholder-count=\"4\"><div>{{ c.label }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ drill.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click or list=\"{{ modules }}\" as=\"m\" hint-placeholder-count=\"5\">\n      <div style=\"{{ m.style }}\">{{ m.label }}<\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goVendor }}\" style=\"display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:5px;font-size:11.5px;color:#B9C0D4;cursor:pointer;border:1px solid #2A3557\" style-hover=\"color:#fff;border-color:#4A5680\">Vendor Portal ↗<\u002Fdiv>\n    <div style=\"font-size:12px;color:#B9C0D4;margin-left:14px\">Anitha Ramesh<\u002Fdiv>\n    <div style=\"width:24px;height:24px;margin-left:8px;border-radius:12px;background:#2A3557;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600\">AR<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n\n    <div style=\"width:236px;flex-shrink:0;background:#fff;border-right:1px solid #E4E7EE;display:flex;flex-direction:column;overflow-y:auto\">\n      <div style=\"padding:18px 16px 14px;border-bottom:1px solid #EEF0F5\">\n        <div style=\"font-size:15px;font-weight:700;letter-spacing:-.015em\">Service Level Management<\u002Fdiv>\n        <div style=\"font-size:11px;color:#8A90A0;margin-top:2px\">Enterprise IT Service Delivery<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 0 24px\">\n        <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"margin-bottom:16px\">\n            <div style=\"padding:0 16px 7px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9AA0AE\">{{ g.label }}<\u002Fdiv>\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ it.go }}\" style=\"{{ it.style }}\">\n                <span style=\"{{ it.bar }}\"><\u002Fspan>\n                <span style=\"flex:1\">{{ it.label }}<\u002Fspan>\n                <span style=\"{{ it.badgeStyle }}\">{{ it.badge }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;overflow-y:auto\">\n\n      <!-- ============ SLM OVERVIEW (landing) ============ -->\n      <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1360px\">\n        <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px\">\n          <div style=\"flex:1;min-width:0\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Service level overview<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">Portfolio health across every agreement, its supporting commitments and the records they govern.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-raw-select value=\"{{ ovPeriod }}\" sc-camel-on-change=\"{{ setOvPeriod }}\" style=\"padding:7px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px\">\n            <sc-for list=\"{{ periodOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div sc-camel-on-click=\"{{ goAllAgreements }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#17213C\">All agreements<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px\">\n          <sc-for list=\"{{ ovKpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ k.go }}\" style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:18px 20px;cursor:pointer\" style-hover=\"border-color:#17213C;box-shadow:0 2px 8px rgba(23,33,60,.08)\">\n              <div style=\"font-s iv>\n            <div style=\"display:grid;grid-template-columns:70px 120px 160px minmax(240px,1fr);gap:14px;min-width:680px;padding:12px 20px;background:#FAFBFD;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n              <div>Ver<\u002Fdiv><div>Effective<\u002Fdiv><div>Approved by<\u002Fdiv><div>Change summary<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ ag.versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:70px 120px 160px minmax(240px,1fr);gap:14px;min-width:680px;padding:14px 20px;border-bottom:1px solid #F0F2F6;font-size:12.5px\">\n                <div style=\"font-weight:700\">v{{ v.n }}<\u002Fdiv><div style=\"color:#5F6368\">{{ v.date }}<\u002Fdiv><div style=\"color:#5F6368\">{{ v.by }}<\u002Fdiv><div>{{ v.summary }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SERVICE TARGET BUILDER ============ -->\n      <sc-if value=\"{{ isTargets }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1160px\">\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:12px;flex-wrap:wrap\">\n          <span sc-camel-on-click=\"{{ goAgList }}\" style=\"color:#1565C0;font-weight:600;cursor:pointer\">Agreements<\u002Fspan><span style=\"color:#B9BFCC\">›<\u002Fspan>\n          <span sc-camel-on-click=\"{{ goAgDetail }}\" style=\"color:#1565C0;font-weight:600;cursor:pointer\">{{ tgtAgName }}<\u002Fspan><span style=\"color:#B9BFCC\">›<\u002Fspan>\n          <span style=\"color:#5F6368\">{{ tgtName }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:220px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ tgtHeading }}<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">Level 2 · belongs to {{ tgtAgName }} v{{ tgtAgVersion }}. Applicability rules sit underneath this target.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-shrink:0\">\n            <div sc-camel-on-click=\"{{ goAgDetail }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Save as draft<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ goAgDetail }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Save target<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tgtIsXla }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"border-radius:10px;padding:18px 20px;border:1px solid #E0D6F2;background:#F7F3FE\">\n            <div style=\"display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:240px\">\n                <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em;color:#4A2E86;margin-bottom:4px\">Experience level target · measured, not clocked<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#4A4358;line-height:1.55\">An XLA has no clock, no calendar and no breach event. It is sampled from surveys and feedback forms over a rolling window, so the builder collects the instrument, the question, the score bands and the drivers instead of a duration and thresholds.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Preview survey<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:18px\">Experience measure<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 20px\">\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target name<\u002Fdiv><input value=\"{{ tgtName }}\" sc-camel-on-change=\"{{ setTgtName }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Parent agreement · level 1<\u002Fdiv>\n                <sc-raw-select value=\"{{ tgtAgId }}\" sc-camel-on-change=\"{{ setTgtAg }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ agreementOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <div style=\"font-size:11px;color:#8A90A0;margin-top:5px\">{{ tgtAgHint }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Experience measure<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ measureOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Instrument<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ instrumentOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Scale<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ scaleOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Committed score<\u002Fdiv><div style=\"display:flex;gap:8px\"><input value=\"4.3\" style=\"width:74px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><sc-raw-select style=\"flex:1;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px\"><option>or better (1–5)<\u002Foption><option>or better (0–10)<\u002Foption><option>or lower (effort)<\u002Foption><\u002Fsc-raw-select><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Rolling window<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option>Quarter, rolling<\u002Foption><option>12 weeks, rolling<\u002Foption><option>Calendar quarter<\u002Foption><option>Half-year<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Minimum responses for validity<\u002Fdiv><input value=\"30\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n              <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Segmentation<\u002Fdiv>\n                <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\"><option>Business unit + location<\u002Foption><option>Persona (new joiner, manager, field)<\u002Foption><option>Offering<\u002Foption><option>None — whole population<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:18px\"><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Survey question as it is asked<\u002Fdiv>\n              <textarea rows=\"2\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;resize:vertical;font-family:inherit\">How satisfied were you with the way your request was handled, end to end?<\u002Ftextarea><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Collection triggers<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0\">When the instrument fires, who receives it, and how long they have to respond.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">+ Add trigger<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"display:grid;grid-template-columns:minmax(190px,1.2fr) 150px 140px 120px 70px;gap:14px;min-width:760px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n                <div>Trigger event<\u002Fdiv><div>Audience<\u002Fdiv><div>Channel<\u002Fdiv><div>Response window<\u002Fdiv><div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ xlaTriggers }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:minmax(190px,1.2fr) 150px 140px 120px 70px;gap:14px;min-width:760px;padding:13px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n                  <div style=\"font-weight:600\">{{ t.event }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.audience }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.channel }}<\u002Fdiv><div style=\"color:#5F6368\">{{ t.window }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Score bands and what each one triggers<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8A90A0;margin-bottom:16px\">XLAs replace percentage-consumed thresholds: there is no clock to escalate against, so action is driven by the band the rolling score lands in.<\u002Fdiv>\n            <sc-for list=\"{{ xlaBands }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #F0F2F6;flex-wrap:wrap\">\n                <span style=\"{{ b.dot }}\"><\u002Fspan>\n                <div style=\"width:104px;font-size:12.5px;font-weight:700\">{{ b.label }}<\u002Fdiv>\n                <div style=\"width:96px;font-size:12.5px;color:#5F6368\">{{ b.range }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:200px;font-size:12.5px;color:#3D424E\">{{ b.action }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Experience drivers<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0\">Operational targets correlated with this score. Drivers explain movement; they do not define the commitment.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">+ Add driver<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"display:grid;grid-template-columns:minmax(210px,1.3fr) 90px 110px minmax(160px,1fr) 70px;gap:14px;min-width:760px;padding:10px 0;border-bottom:1px solid #E4E7EE;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0\">\n                <div>Driver<\u002Fdiv><div>Weight<\u002Fdiv><div>Current<\u002Fdiv><div>Correlation<\u002Fdiv><div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ xlaDrivers }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:minmax(210px,1.3fr) 90px 110px minmax(160px,1fr) 70px;gap:14px;min-width:760px;padding:13px 0;border-bottom:1px solid #F0F2F6;font-size:12.5px;align-items:center\">\n                  <div style=\"font-weight:600\">{{ d.name }}<\u002Fdiv>\n                  <div>{{ d.weight }}<\u002Fdiv>\n                  <div style=\"{{ d.curStyle }}\">{{ d.current }}<\u002Fdiv>\n                  <div style=\"color:#5F6368\">{{ d.corr }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#5F6368;cursor:pointer;white-space:nowrap\">Edit<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-radius:10px;padding:18px 20px;border:1px solid #E4E7EE;background:#fff\">\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0;margin-bottom:12px\">Why this target behaves differently<\u002Fdiv>\n            <sc-for list=\"{{ xlaNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:10px;padding:10px 0;border-top:1px solid #F0F2F6\">\n                <span style=\"{{ n.dot }}\"><\u002Fspan>\n                <div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:600\">{{ n.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px;line-height:1.5\">{{ n.detail }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tgtIsStd }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n          <div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n              <div style=\"font-size:14px;font-weight:700;margin-bottom:18px\">Definition<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 20px\">\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Target name<\u002Fdiv><input value=\"{{ tgtName }}\" sc-camel-on-change=\"{{ setTgtName }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px\"><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Parent agreement · level 1<\u002Fdiv>\n                  <sc-raw-select value=\"{{ tgtAgId }}\" sc-camel-on-change=\"{{ setTgtAg }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                    <sc-for list=\"{{ agreementOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <div style=\"font-size:11px;color:#8A90A0;margin-top:5px\">{{ tgtAgHint }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Record type<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>Service Request<\u002Foption><option>Incident<\u002Foption><option>Change<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Measure<\u002Fdiv>\n                  <sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;font-size:12.5px;background:#fff\">\n                    <sc-for list=\"{{ measureOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Commitment value<\u002Fdiv><div style=\"display:flex;gap:8px\"><input value=\"2\" style=\"width:70px;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px\"><sc-raw-select style=\"flex:1;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>business days<\u002Foption><option>business hours<\u002Foption><option>calendar hours<\u002Foption><\u002Fsc-raw-select><\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Calendar<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>Executive Support Calendar<\u002Foption><option>Business Support Hours<\u002Foption><option>24x7<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Escalation matrix<\u002Fdiv><sc-raw-select style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\"><option>SLA · Enterprise IT<\u002Foption><option>SLA · Executive<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid #F0F2F6\">\n                <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:12px\">Thresholds<\u002Fdiv>\n                <div style=\"display:flex;gap:26px;align-items:center;flex-wrap:wrap\">\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#E8A33D\"><\u002Fspan><span style=\"font-size:12.5px\">Warning<\u002Fspan><input value=\"75\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#D97706\"><\u002Fspan><span style=\"font-size:12.5px\">Management<\u002Fspan><input value=\"90\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:9px;height:9px;border-radius:5px;background:#C5221F\"><\u002Fspan><span style=\"font-size:12.5px\">Breach<\u002Fspan><input value=\"100\" style=\"width:56px;padding:6px 9px;border:1px solid #D5D9E2;border-radius:6px\"><span style=\"font-size:12.5px;color:#8A90A0\">%<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Governed variants<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8A90A0\">Each variant declares who may assign it and whether it carries a fee (FR-SLM-040 to 045).<\u002Fdiv>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:5px 11px;border:1px solid #D5D9E     <div style=\"display:flex;gap:10px;margin-top:18px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ closeCalForms }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Create calendar<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeCalForms }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">Cancel<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n          <div style=\"flex:1 1 250px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{ calendars }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">\n                <div style=\"font-size:13px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8A90A0;margin-top:2px\">{{ c.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:24px 26px\">\n              <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\">\n                <div style=\"font-size:16px;font-weight:700;letter-spacing:-.015em\">{{ cal.name }}<\u002Fdiv>\n                <span style=\"padding:2px 9px;border-radius:10px;background:#EEF0F5;color:#5F6368;font-size:10.5px;font-weight:700\">v{{ cal.version }}<\u002Fspan>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A90A0\">{{ cal.tz }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:10px\">Weekly coverage<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px\">\n                <sc-for list=\"{{ cal.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ d.style }}\">\n                    <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75\">{{ d.day }}<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:600;margin-top:6px\">{{ d.hours }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:12px\">Holidays &amp; blackouts<\u002Fdiv>\n                <sc-for list=\"{{ cal.holidays }}\" as=\"h\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F0F2F6\">\n                    <div style=\"width:78px;font-size:12px;color:#8A90A0\">{{ h.date }}<\u002Fdiv>\n                    <div style=\"flex:1;font-size:12.5px;font-weight:600\">{{ h.name }}<\u002Fdiv>\n                    <span style=\"{{ h.chip }}\">{{ h.type }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:#FFF9EC;border:1px solid #F0DCB0;border-radius:10px;padding:22px 24px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                  <span style=\"width:8px;height:8px;border-radius:4px;background:#C77700\"><\u002Fspan>\n                  <div style=\"font-size:14px;font-weight:700;color:#7A4B00\">Coverage feasibility risk<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7A4B00;line-height:1.6\">Service Desk OLA triage of 30 minutes uses <strong>Business Hours Mon–Fri<\u002Fstrong>, but the linked SLA commits to a 1-hour response on <strong>24x7<\u002Fstrong>. Out-of-hours requests cannot be supported.<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:16px\">\n                  <div style=\"padding:7px 13px;border-radius:6px;background:#17213C;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Raise remediation<\u002Fdiv>\n                  <div style=\"padding:7px 13px;border:1px solid #D9C48C;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:#7A4B00;cursor:pointer\">Record exception<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ ESCALATION MATRIX ============ -->\n      <sc-if value=\"{{ isEsc }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1160px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:220px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Escalation matrix<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">One framework, separately configurable per commitment type. Ownership stays distinct even when impact cascades.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-shrink:0\">\n            <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border:1px solid #D5D9E2;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;color:#1A1A1A;cursor:pointer;white-space:nowrap\">+ Add level<\u002Fdiv>\n tom:5px\">Threshold<\u002Fdiv><input value=\"{{ r.threshold }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px\"><\u002Fdiv>\n                    <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Acknowledgement deadline<\u002Fdiv><input value=\"{{ r.ack }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px\"><\u002Fdiv>\n                    <div><div style=\"font-size:11px;font-weight:600;color:#5F6368;margin-bottom:5px\">Clock behaviour<\u002Fdiv>\n                      <sc-raw-select value=\"{{ r.clock }}\" sc-camel-on-change=\"{{ r.setClock }}\" style=\"width:100%;padding:8px 11px;border:1px solid #D5D9E2;border-radius:6px;background:#fff\">\n                        <sc-for list=\"{{ clockOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #E9ECF2;font-size:12.5px;color:#5F6368;line-height:1.6\">{{ r.action }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:20px 24px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:10px\">Dependency-aware cascade<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px\">\n            <sc-for list=\"{{ cascade }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A90A0;margin-top:14px;line-height:1.6\">A UC breach does not create a customer-facing escalation if the internal team can still absorb the impact and meet the SLA.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ IMPROVEMENT ============ -->\n      <sc-if value=\"{{ isImprove }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:1320px\">\n        <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:220px\">\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Improvement<\u002Fh1>\n            <div style=\"font-size:13px;color:#5F6368\">Opportunities detected from breach trends and service reviews, and the initiatives resolving them.<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ noop }}\" style=\"padding:8px 14px;border-radius:6px;background:#17213C;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0\">+ New initiative<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n          <div style=\"flex:1 1 300px;min-width:0;background:#fff;border:1px solid #E4E7EE;border-radius:10px;padding:22px 24px\">\n            <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Detected opportunities<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8A90A0;margin-bottom:12px\">Recurring gaps awaiting triage<\u002Fdiv>\n            <sc-for list=\"{{ opportunities }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <div style=\"padding:13px 0;border-top:1px solid #F0F2F6\">\n                <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                  <span style=\"{{ o.dot }}\"><\u002Fspan>\n                  <div style=\"flex:1\"><div style=\"font-size:12.5px;font-weight:600;line-height:1.4\">{{ o.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A90A0;margin-top:3px\">{{ o.meta }}<\u002Fdiv><\u002Fdiv> x;color:#3D424E;line-height:1.55';\n      v.graphNote=ag.name+' · '+tName+'. The internal OLAs and vendor UCs that underpin this target, in trigger order. Click a node to trace impact.';\n    }\n\n    /* ---------- CALENDARS ---------- */\n    v.isCal = S==='cal';\n    if(v.isCal){\n      v.excFormOpen=st.calPanel==='exc'; v.calFormOpen=st.calPanel==='cal';\n      v.openExcForm=()=>this.set('calPanel', st.calPanel==='exc'?null:'exc');\n      v.openCalForm=()=>this.set('calPanel', st.calPanel==='cal'?null:'cal');\n      v.closeCalForms=()=>this.set('calPanel',null);\n      v.excImpact='Impact preview · 42 running target instances reference this calendar. 6 of them would move their due date by one working day; 2 SLAs lose their remaining float and would be flagged to the SLM Manager before the exception takes effect.';\n      v.newCalDays=[{day:'Mon',hours:'09:00 – 17:30'},{day:'Tue',hours:'09:00 – 17:30'},{day:'Wed',hours:'09:00 – 17:30'},{day:'Thu',hours:'09:00 – 17:30'},{day:'Fri',hours:'09:00 – 17:00'},{day:'Sat',hours:'Closed'},{day:'Sun',hours:'Closed'}];\n      v.newCalNote='42.5 hours of weekly coverage. Targets committing to 24x7 cannot select this calendar without an approved coverage exception.';\n      v.calendars=CAL_LIST.map(c=>({...c,go:()=>this.set('cal',c.k),\n        style:'padding:14px 18px;border-bottom:1px solid #F0F2F6;cursor:pointer;border-left:3px solid '+(st.cal===c.k?NAVY:'transparent')+';background:'+(st.cal===c.k?'#F1F4FA':'#fff')}));\n      const c=CAL_DATA[st.cal];\n      v.cal={...c,\n        days:c.days.map(d=>({...d,style:'padding:12px 10px;border-radius:8px;text-align:center;background:'+(d.on?'#EEF3FB':'#F7F8FA')+';color:'+(d.on?'#12509E':'#9AA0AE')})),\n        holidays:c.holidays.map(h=>({...h,chip:h.type==='Blackout'?CHIP.bad:h.type==='Policy'?CHIP.neutral:CHIP.info}))\n      };\n    }\n\n    /* ---------- ESCALATION ---------- */\n    v.isEsc = S==='esc';\n    if(v.isEsc){\n      v.escTabs=['SLA','OLA','UC'].map(t=>({label:t+' commitments',go:()=>this.setState({escType:t,escOpen:null}),\n        style:'padding:7px 18px;border-radius:6px;font-size:12.5px;font-weight:'+(st.escType===t?'700':'500')+';cursor:pointer;background:'+(st.escType===t?'#fff':'transparent')+';color:'+(st.escType===t?NAVY:MUTED)+';box-shadow:'+(st.escType===t?'0 1px 3px rgba(0,0,0,.12)':'none')}));\n      const colors=[OK,'#E8A33D',WARN,BAD,'#7A1512'];\n      v.recipientOptions=['Assignee','Service Desk Lead','Team Lead','Shift Supervisor','Group Manager','Service Owner','Problem Management','Customer Governance','Executive Sponsor','Internal UC Owner','Vendor Support Contact','Vendor Management','Vendor Management Lead','Supplier Manager','Commercial / Legal','Executive Authority','Commercial'];\n      v.channelOptions=['In-app','In-app + email','Email','Email + SMS','Email + phone','Portal + email','Incident bridge','Email + incident bridge','Formal notice'];\n      v.clockOptions=['Continues','Pauses','Transfers','Remains with original group'];\n      v.escRows=ESC_DEF[st.escType].map((r,i)=>{\n        const key=st.escType+':'+i, ov=st.escOverrides[key]||{};\n        const merged={...r,...ov};\n        const open=st.escOpen===i;\n        const put=(field)=>e=>this.setState({escOverrides:{...st.escOverrides,[key]:{...ov,[field]:e.target.value}}});\n        return {...merged, open, caret: open?'▾':'▸',\n          toggle:()=>this.set('escOpen', open?null:i),\n          dot:'width:9px;height:9px;border-radius:5px;background:'+colors[i],\n          rowStyle:'display:grid;grid-template-columns:150px minmax(230px,1fr) 190px 110px 30px;gap:16px;min-width:860px;padding:15px 22px;border-bottom:1px solid '+(open?'transparent':'#F0F2F6')+';cursor:pointer;align-items:center;background:'+(open?'#FAFBFD':'#fff'),\n          setRecipient:put('recipient'), setBackup:put('backup'), setChannel:put('channel'), setClock:put('clock')};\n      });\n      v.cascade=[\n        {label:'UC breached',c:'#F0EAFB',fg:'#5B3AA6'},{label:'→',c:'transparent',fg:'#9AA0AE'},\n        {label:'Assess OLA impact',c:'#E6F4EC',fg:'#1E6F47'},{label:'→',c:'transparent',fg:'#9AA0AE'},\n        {label:'OLA at risk',c:'#FFF4E0',fg:'#A35C00'},{label:'→',c:'transparent',fg:'#9AA0AE'},\n        {label:'Recalculate SLA risk',c:'#E8F0FB',fg:'#12509E'},{label:'→',c:'transparent',fg:'#9AA0AE'},\n        {label:'Customer escalation only if SLA at risk',c:'#FDECEA',fg:'#A31816'}\n      ].map(c=>({label:c.label,style:c.c==='transparent'?'color:#9AA0AE;font-size:13px':'padding:6px 12px;border-radius:14px;font-weight:600;background:'+c.c+';color:'+c.fg}));\n    }\n\n    /* ---------- IMPROVEMENT ---------- */\n    v.isImprove = S==='improve';\n    if(v.isImprove){\n      v.opportunities=[\n        {title:'Service Desk triage OLA breached 14 times in 30 days',meta:'Detected from breach trend · affects 3 SLAs',c:BAD},\n        {title:'Northwind dispatch late on 9 of 42 orders',meta:'UC performance · Vendor Management review due',c:WARN},\n        {title:'Calendar mismatch: OLA Mon–Fri vs SLA 24x7',meta:'Coverage risk raised by validation',c:WARN},\n        {title:'Onboarding day-1 experience score 3.4 / 5 in EMEA',meta:'From XLA survey data · 2 quarters declining',c:WARN}\n      ].map(o=>({...o,dot:dot(o.c)}));\n      v.initiatives=[\n        {title:'Extend Service Desk coverage to 07:00–21:00',status:'In progress',desc:'Close the calendar gap between the Service Desk OLA and the 24x7 customer commitment. Adds an early and late shift with follow-the-sun handover.',owner:'R. Fernandes',progress:'60%',n:60,\n          links:['OLA · Service Desk','CHG-8841','SLA · Enterprise IT','Opportunity #114'],state:'warn'},\n        {title:'Northwind dispatch SLA renegotiation',status:'Planned',desc:'Move next-business-day dispatch to a cut-off-based commitment and add penalty credits for repeated failure.',owner:'Vendor Mgmt',progress:'15%',n:15,\n          links:['UC-2291','Contract review Q4','Opportunity #118'],state:'neutral'},\n        {title:'Automate Finance regulatory access approvals',status:'In progress',desc:'Removes an average 6h approval wait that consumes the 8-business-hour target float.',owner:'P. Anand',progress:'80%',n:80,\n          links:['Rule-014','REL-2209','Opportunity #109'],state:'warn'},\n        {title:'Day-1 readiness experience programme',status:'Validating',desc:'Effectiveness measured against the Onboarding Experience XLA for two consecutive quarters before closure.',owner:'M. Osei',progress:'95%',n:95,\n          links:['XLA · Onboarding','Service review Q3'],state:'ok'}\n      ].map(i=>({...i,\n        chip: i.state==='ok'?CHIP.ok:i.state==='warn'?CHIP.info:CHIP.neutral,\n        barStyle: bar(i.n, i.n>=90?OK:INFO)\n      }));\n    }\n\n    /* ---------- REQUEST FORM ---------- */\n    v.isForm = S==='form';\n    if(v.isForm){\n      const cur=VARIANTS.find(x=>x.k===st.variant)||VARIANTS[0];\n      v.lines=[\n        {name:'Laptop Provisioning',service:'IT Support Service · Offering-specific SLA',src:'Offering SLA',srcChip:CHIP.info,hasVariants:true,fixed:false,\n          needsApproval: cur.cost>0,\n          variants:VARIANTS.map(x=>({name:x.name,detail:x.detail,fee:x.fee,\n            pick:()=>this.set('variant',x.k),\n            style:'display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:8px;cursor:pointer;border:'+(st.variant===x.k?'1.5px solid '+NAVY:'1px solid #E4E7EE')+';background:'+(st.variant===x.k?'#F6F8FC':'#fff'),\n            radio:'width:15px;height:15px;border-radius:8px;flex-shrink:0;border:'+(st.variant===x.k?'4.5px solid '+NAVY:'1.5px solid #C7CCD8')+';background:#fff',\n            feeStyle:'font-size:12.5px;font-weight:700;color:'+(x.cost>0?NAVY:MUTED)}))},\n        {name:'Identity & Access Setup',service:'Workplace Identity Service · inherited Service default',src:'Service default',srcChip:CHIP.neutral,hasVariants:false,fixed:true,\n          fixedTarget:'Account provisioning · 2 hours',fixedDetail:'24x7 calendar · no variants offered',fixedNote:'Included'},\n        {name:'Desk & Peripherals',service:'Workplace Facilities Service',src:'Bundle target',srcChip:CHIP.purple,hasVariants:false,fixed:true,\n          fixedTarget:'Delivered before start date',fixedDetail:'Business Support Hours · component of bundle target',fixedNote:'Included'}\n      ];\n      v.summaryLines=[\n        {name:'Laptop Provisioning',commitment:cur.detail.split(' · ')[0],fee:cur.cost>0?'$'+cur.cost:'—'},\n        {name:'Identity & Access Setup',commitment:'2 hours',fee:'—'},\n        {name:'Desk & Peripherals',commitment:'Before start date',fee:'—'}\n      ];\n      v.total = cur.cost>0 ? '$'+cur.cost+'.00' : '$0.00';\n      v.bundleEta = cur.k==='nbd' ? 'Tue 23 Sep' : cur.k==='exp' ? 'Wed 24 Sep' : 'Mon 29 Sep';\n    }\n\n    /* ---------- VENDOR ---------- */\n    if(v.isVendor){\n      v.vendorKpis=[\n        {label:'Open UC targets',value:'6',sub:'2 requiring action',c:NAVY},\n        {label:'At risk',value:'1',sub:'dispatch confirmation overdue',c:WARN},\n        {label:'30-day attainment',value:'89.1%',sub:'contract floor 95%',c:BAD}\n      ].map(k=>({...k,valStyle:'font-size:27px;font-weight:700;letter-spacing:-.025em;margin-top:8px;line-height:1;color:'+k.c}));\n      v.vendorTargets=[\n        {name:'Next-business-day dispatch · order NW-77412',meta:'Due 22 Sep 18:00 CEST · supports SR-10482',state:'At risk',pct:88},\n        {name:'Advance replacement · order NW-77390',meta:'Due 24 Sep 12:00 CEST',state:'On track',pct:32},\n        {name:'RMA acknowledgement · case NW-5512',meta:'Due 23 Sep 09:00 CEST',state:'On track',pct:54}\n      ].map(t=>({...t,barStyle:bar(t.pct,stateColor(t.state)),chip:stateChip(t.state)}));\n      v.vendorActions=[\n        {title:'Confirm dispatch for order NW-77412',due:'22 Sep 18:00 CEST',ref:'Escalation L1 · raised by Vendor Management',done:false},\n        {title:'Provide ETA for backordered 16\" units',due:'23 Sep 12:00 CEST',ref:'Escalation L0 · notification',done:true}\n      ].map((a,i)=>({...a,\n        ack:()=>{},\n        btn: a.done?'Acknowledged':'Acknowledge',\n        btnStyle: a.done\n          ? 'padding:7px 14px;border-radius:6px;background:#EDF2EE;color:#4A6B58;font-size:12px;font-weight:600'\n          : 'padding:7px 14px;border-radius:6px;background:#2F4A3C;color:#fff;font-size:12px;font-weight:600;cursor:pointer'}));\n      v.vendorComms=[\n        {who:'Vendor Management (ESM)',when:'22 Sep 16:20',msg:'Dispatch confirmation for NW-77412 is overdue. This order underpins an at-risk customer commitment — please confirm today.'},\n        {who:'Northwind Support',when:'22 Sep 14:05',msg:'Units picked and awaiting carrier collection. Confirmation will follow once the carrier scans the consignment.'},\n        {who:'Vendor Management (ESM)',when:'21 Sep 09:10',msg:'Order NW-77412 raised against UC-2291 with next-business-day dispatch commitment.'}\n      ];\n    }\n\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
