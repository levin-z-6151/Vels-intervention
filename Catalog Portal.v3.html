document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:28px;padding:0 11px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12px;color:#1A1A1A;cursor:pointer;margin-top:10px;width:100%\">Manage offerings<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ itemSelField.isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #F0F1F5\">\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:8px\">Library link<\u002Fdiv>\n                          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                            <span style=\"{{ itemSelField.linkBadgeStyle }}\">{{ itemSelField.linkState }}<\u002Fspan>\n                            <span style=\"font-size:11.5px;color:#9AA0A6\">{{ itemSelField.libId }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"font-size:11.5px;color:#5F6368;line-height:1.5\">{{ itemSelField.linkHint }}<\u002Fdiv>\n                          <button sc-camel-on-click=\"{{ itemFocusQuestions }}\" style=\"height:28px;padding:0 11px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12px;color:#1A1A1A;cursor:pointer;margin-top:10px;width:100%\">Manage questions<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #F0F1F5\">\n                        <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:8px\">Show / hide rule<\u002Fdiv>\n                        <div style=\"background:#F9FBFD;border:1px solid #E3E9F0;border-radius:4px;padding:10px;font-size:12px;line-height:1.6\">{{ itemSelField.rule }}<\u002Fdiv>\n                        <a href=\"# nd:#F9FAFC;border-bottom:1px solid #E0E0E0;min-width:760px\">\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Offering<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Type<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Variant<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Fulfilment group<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Status<\u002Fdiv>\n                          <div><\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-for list=\"{{ itemOfferings }}\" as=\"o\" hint-placeholder-count=\"4\">\n                          <div style=\"display:grid;grid-template-columns:1.5fr .9fr 1.3fr 1.2fr .9fr 34px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5;min-width:760px\">\n                            <div style=\"font-size:12.5px;font-weight:500\">{{ o.name }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ o.type }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ o.variant }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ o.group }}<\u002Fdiv>\n                            <div><span style=\"{{ o.badgeStyle }}\">{{ o.status }}<\u002Fspan><\u002Fdiv>\n                            <div style=\"color:#C6CBD4;font-size:13px;cursor:pointer\">×<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n\n                  <div style=\"background:#fff;border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                    <div sc-camel-on-click=\"{{ itemToggleQuestions }}\" style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer\">\n                      <span style=\"{{ itemQCaretStyle }}\">▶<\u002Fspan>\n                      <div style=\"font-size:12.5px;font-weight:600;flex:1\">Questions ({{ itemQuestionCount }})<\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ itemOpenLibraryPicker }}\" style=\"height:28px;padding:0 11px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12px;color:#1A1A1A;cursor:pointer\">Add from library<\u002Fbutton>\n                      <button style=\"height:28px;padding:0 11px;border:none;background:#1565C0;border-radius:4px;font-size:12px;font-weight:600;color:#fff;cursor:pointer\">+ New question<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ itemQOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"border-top:1px solid #E0E0E0;overflow-x:auto\">\n                        <div style=\"display:grid;grid-template-columns:1.8fr 1.2fr .8fr .8fr 1fr;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0;min-width:760px\">\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Question<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Control<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Offerings<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Used in<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Link state<\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-for list=\"{{ itemQuestions }}\" as=\"q\" hint-placeholder-count=\"4\">\n                          <div style=\"display:grid;grid-template-columns:1.8fr 1.2fr .8fr .8fr 1fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5;min-width:760px\">\n                            <div>\n                              <div style=\"font-size:12.5px;font-weight:500\">{{ q.label }}<\u002Fdiv>\n                              <div style=\"font-size:11px;color:#9AA0A6;margin-top:2px\">{{ q.id }}<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ q.control }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ q.offerings }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#5F6368\">{{ q.usedIn }}<\u002Fdiv>\n                            <div><span style=\"{{ q.badgeStyle }}\">{{ q.linkState }}<\u002Fspan><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <div style=\"padding:11px 14px;background:#FFF8E1;font-size:12px;color:#5F4B00;line-height:1.6\"><b>NOTE:<\u002Fb> Linked questions update everywhere when the library version changes. Detached copies stay frozen on this item.<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- TECHNICIAN VIEW -->\n            <sc-if value=\"{{ itemTabTech }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 20px\">\n                <div style=\"font-size:12.5px;color:#5F6368;max-width:660px;line-height:1.55;margin-bottom:16px;text-wrap:pretty\">Fields the fulfilment technician sees on the request. Requester-facing answers are read-only here; technician fields never appear in the portal.<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:1.4fr 1.3fr .9fr .9fr;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Field<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Control<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Source<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Visibility<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ itemTechFields }}\" as=\"tf\" hint-placeholder-count=\"5\">\n                    <div style=\"display:grid;grid-template-columns:1.4fr 1.3fr .9fr .9fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ tf.label }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ tf.control }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ tf.source }}<\u002Fdiv>\n                      <div><span style=\"{{ tf.pillStyle }}\">{{ tf.visibility }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 14px;background:#F9FAFC\">\n                    <button style=\"height:28px;padding:0 11px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12px;color:#1A1A1A;cursor:pointer;height:30px\">+ Add ize:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Can request<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Can approve<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ itemAccess }}\" as=\"ac\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:1.6fr 1.3fr .7fr .8fr .8fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ ac.audience }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ ac.matchOn }}<\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ ac.canView }}\" disabled=\"{{ itemFieldsLocked }}\"><\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ ac.canRequest }}\" disabled=\"{{ itemFieldsLocked }}\"><\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ ac.canApprove }}\" disabled=\"{{ itemFieldsLocked }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- LIFECYCLE -->\n            <sc-if value=\"{{ itemTabLifecycle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 20px\">\n                <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:20px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ itemLifecycleStages }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ st.style }}\">{{ st.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:680px\">\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Status<\u002Flabel>\n                    <sc-raw-select value=\"{{ itemStatus }}\" sc-camel-on-change=\"{{ itemSetStatus }}\" disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                      <sc-for list=\"{{ itemStatusOptions }}\" as=\"so\" hint-placeholder-count=\"4\">\n                        <option>{{ so }}<\u002Foption>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Owner<\u002Flabel>\n                    <sc-raw-select disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                      <option>IT Asset Team<\u002Foption>\n                      <option>Network Security<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Published on<\u002Flabel>\n                    <input value=\"12 Aug 2026\" disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Next review<\u002Flabel>\n                    <input value=\"12 Feb 2027\" disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Retirement date<\u002Flabel>\n                    <input placeholder=\"Not scheduled\" disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Successor item<\u002Flabel>\n                    <sc-raw-select disabled=\"{{ itemReadOnly }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                      <option>— None —<\u002Foption>\n                      <option>Laptop provisioning (EMEA)<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- VERSIONS -->\n            <sc-if value=\"{{ itemTabVersions }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 20px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap\">\n                  <div style=\"font-size:13px;font-weight:600;flex:1\">Versions<\u002Fdiv>\n                  <span style=\"font-size:11.5px;color:#9AA0A6\">Every published version is linked to a change record<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:.6fr 1fr 1fr 1.1fr 1fr 1.4fr .8fr;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Version<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">State<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Change<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Change state<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Published<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Summary<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Action<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ itemVersions }}\" as=\"v\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:.6fr 1fr 1fr 1.1fr 1fr 1.4fr .8fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:600\">{{ v.version }}<\u002Fdiv>\n                      <div><span style=\"{{ v.stateStyle }}\">{{ v.state }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#1565C0;cursor:pointer\">{{ v.change }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ v.changeState }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ v.published }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#5F6368;line-height:1.45\">{{ v.summary }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#1565C0;cursor:pointer\">{{ v.action }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;display:flex;gap:14px;flex-wrap:wrap\">\n                  <div style=\"flex:1;min-width:280px;background:#FBFCFE;border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:10px\">Draft v4 changes against v3<\u002Fdiv>\n                    <sc-for list=\"{{ itemDiff }}\" as=\"d\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px solid #F0F1F5\">\n                        <span style=\"{{ d.tagStyle }}\">{{ d.tag }}<\u002Fspan>\n                        <span style=\"flex:1;color:#5F6368;line-height:1.45\">{{ d.text }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:260px;background:#FFF8E1;border:1px solid #F3E4B4;border-radius:6px;padding:14px 16px;font-size:12px;color:#5F4B00;line-height:1.6\"><b>NOTE:<\u002Fb> Publishing v4 requires change <b>CHG-4482<\u002Fb> to be approved and inside its implementation window.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- APPROVALS -->\n            <sc-if value=\"{{ itemTabApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 20px\">\n                <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n                  <div style=\"font-size:13px;font-weight:600;flex:1\">Approvals for this catalog item<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ itemToggleApprovals }}\" style=\"display:flex;align-items:center;gap:8px;font-size:12.5px;color:#5F6368;cursor:pointer\">\n                    <div style=\"{{ itemApprovalTrackStyle }}\"><div style=\"{{ itemApprovalKnobStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <span>Require approval before publish<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:.5fr 1.3fr 1.3fr 1.4fr 1fr;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">#<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Transition<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Approver<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Condition<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">SLA<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ itemApprovals }}\" as=\"ap\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:.5fr 1.3fr 1.3fr 1.4fr 1fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"{{ ap.numStyle }}\">{{ ap.n }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ ap.transition }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ ap.approver }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368;line-height:1.45\">{{ ap.condition }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ ap.sla }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 14px;background:#F9FAFC;display:flex;gap:8px\">\n                    <button style=\"height:30px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer\">+ Add stage<\u002Fbutton>\n                    <button style=\"height:30px;padding:0 12px;border:none;background:transparent;font-size:12.5px;color:#5F6368;cursor:pointer\">Reorder<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;background:#F9FBFD;border:1px solid #E3E9F0;border-radius:6px;padding:12px 14px;font-size:12px;color:#5F6368;line-height:1.6\">Request-time approvals are configured on the offering. These stages govern the item's own lifecycle — publish, major revisions and retirement.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid #E0E0E0;background:#F9FAFC\">\n              <sc-if value=\"{{ itemIsDraft }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ itemSaveDraft }}\" style=\"height:32px;padding:0 13px;border:none;background:#1565C0;border-radius:4px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer\">Save draft<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ itemSubmit }}\" style=\"height:32px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer\">Submit for approval<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ itemIsLive }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"flex:1;font-size:12px;color:#9AA0A6\">Published version — editing happens in the draft.<\u002Fspan>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ setCloseForm }}\" style=\"height:32px;padding:0 14px;border:none;background:transparent;font-size:12.5px;color:#5F6368;cursor:pointer\">Close<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- catalog / category form -->\n        <sc-if value=\"{{ setIsCatForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ setCloseForm }}\" style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#1565C0;cursor:pointer;margin-bottom:16px\">\n            <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:14px;height:14px\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n            <span>{{ setFormTitle }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n            <div style=\"display:flex;gap:2px;padding:0 18px;border-bottom:1px solid #E0E0E0\">\n              <sc-for list=\"{{ catFormTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- DETAILS -->\n            <sc-if value=\"{{ catTabDetails }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;padding:20px\">\n                <div>\n                  <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\"><span style=\"color:#D32F2F\">*<\u002Fspan> {{ catEntity }} Name<\u002Flabel>\n                  <input value=\"{{ catRecordName }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\"><span style=\"color:#D32F2F\">*<\u002Fspan> Owner<\u002Flabel>\n                  <sc-raw-select style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                    <option>Alex Morgan<\u002Foption>\n                    <option>Priya Nair<\u002Foption>\n                    <option>Sam Lee<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <sc-if value=\"{{ catIsCategory }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>\n                    <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Parent Category<\u002Flabel>\n                    <sc-raw-select style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff\">\n                      <option>— None —<\u002Foption>\n                      <option>Hardware &amp; Devices<\u002Foption>\n                      <option>Network &amp; Connectivity<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div>\n                  <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Icon<\u002Flabel>\n                  <div style=\"display:flex;align-items:center;gap:12px\">\n                    <div style=\"width:32px;height:32px;border:1px solid #E0E0E0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#1565C0\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:16px;height:16px\"><path d=\"M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z\"><\u002Fpath><path d=\"M3 7.5l9 4.5 9-4.5\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <a href=\"#\" style=\"font-size:12.5px\">Select Icon<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"grid-column:1/-1\">\n                  <label style=\"font-size:12.5px;color:#5F6368;margin-bottom:5px;display:block\">Description<\u002Flabel>\n                  <textarea rows=\"3\" placeholder=\"What this {{ catEntityLower }} covers\" style=\"width:100%;padding:9px 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;line-height:1.55;outline:none;resize:vertical\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- SCOPING -->\n            <sc-if value=\"{{ catTabScoping }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:20px\">\n                <div style=\"font-size:12.5px;color:#5F6368;line-height:1.55;max-width:660px;margin-bottom:16px;text-wrap:pretty\">Who can see this {{ catEntityLower }}, request from it, and approve what is requested. Rules apply top to bottom; the widest matching rule wins for visibility.<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:1.6fr 1.2fr .7fr .8fr .8fr 34px;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Audience<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Match on<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Can see<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Can request<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Can approve<\u002Fdiv>\n                    <div><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ catScoping }}\" as=\"sc\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:1.6fr 1.2fr .7fr .8fr .8fr 34px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ sc.audience }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ sc.matchOn }}<\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ sc.canSee }}\"><\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ sc.canRequest }}\"><\u002Fdiv>\n                      <div><input type=\"checkbox\" sc-camel-default-checked=\"{{ sc.canApprove }}\"><\u002Fdiv>\n                      <div style=\"color:#C6CBD4;font-size:13px;cursor:pointer\">×<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 14px;background:#F9FAFC\">\n                    <button style=\"height:30px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer\">+ Add audience<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:14px;margin-top:16px;flex-wrap:wrap\">\n                  <div style=\"flex:1;min-width:260px;background:#FBFCFE;border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:10px\">Consumption<\u002Fdiv>\n                    <sc-for list=\"{{ catConsumption }}\" as=\"cn\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px\">\n                        <span style=\"color:#5F6368\">{{ cn.label }}<\u002Fspan>\n                        <span style=\"font-weight:500\">{{ cn.value }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:260px;background:#FFF8E1;border:1px solid #F3E4B4;border-radius:6px;padding:14px 16px;font-size:12px;color:#5F4B00;line-height:1.6\">\n                    <b>NOTE:<\u002Fb> Users outside every rule cannot see this {{ catEntityLower }} in the portal, even when they hold a direct link to one of its items.\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- FILTERING -->\n            <sc-if value=\"{{ catTabFiltering }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:20px\">\n                <div style=\"font-size:12.5px;color:#5F6368;line-height:1.55;max-width:660px;margin-bottom:16px;text-wrap:pretty\">{{ catFilterIntro }}<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #E0E0E0;background:#F9FAFC\">\n                    <div style=\"font-size:12.5px;font-weight:600;flex:1\">Include when all of these match<\u002Fdiv>\n                    <sc-raw-select style=\"height:28px;border:1px solid #E0E0E0;border-radius:4px;font-size:12px;padding:0 6px;background:#fff\">\n                      <option>All conditions<\u002Foption>\n                      <option>Any condition<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ catFilterRules }}\" as=\"fr\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:1.3fr .8fr 2fr 34px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <sc-raw-select style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff;height:30px\">\n                        <sc-for list=\"{{ fr.fieldOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                          <option>{{ o }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                      <sc-raw-select style=\"width:100%;height:32px;padding:0 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;outline:none;background:#fff;height:30px\">\n                        <option>{{ fr.operator }}<\u002Foption>\n                        <option>is not<\u002Foption>\n                        <option>in<\u002Foption>\n                      <\u002Fsc-raw-select>\n                      <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n                        <sc-for list=\"{{ fr.values }}\" as=\"v\" hint-placeholder-count=\"2\">\n                          <span style=\"font-size:11.5px;border:1px solid #E0E0E0;background:#fff;border-radius:12px;padding:2px 9px;color:#5F6368\">{{ v }} ×<\u002Fspan>\n                        <\u002Fsc-for>\n                        <span style=\"font-size:11.5px;color:#1565C0;cursor:pointer;padding:2px 4px\">+ value<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"color:#C6CBD4;font-size:13px;cursor:pointer\">×<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 14px;background:#F9FAFC;display:flex;gap:8px\">\n                    <button style=\"height:30px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer\">+ Add condition<\u002Fbutton>\n                    <button style=\"height:30px;padding:0 ">Retirement plan<\u002Flabel>\n                    <textarea rows=\"3\" placeholder=\"What happens to open requests and published items on retirement\" style=\"width:100%;padding:9px 10px;border:1px solid #E0E0E0;border-radius:4px;font-size:13px;line-height:1.55;outline:none;resize:vertical\"><\u002Ftextarea>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:18px;background:#FFF8E1;border:1px solid #F3E4B4;border-radius:6px;padding:12px 14px;font-size:12px;color:#5F4B00;line-height:1.6\">\n                  <b>NOTE:<\u002Fb> Retiring a {{ catEntityLower }} hides it from the portal immediately. Open requests continue on the version they were raised against.\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ASSOCIATED OFFERINGS (Offering Questions) -->\n            <sc-if value=\"{{ catTabAssociated }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:20px\">\n                <div style=\"font-size:12.5px;color:#5F6368;line-height:1.55;max-width:660px;margin-bottom:16px;text-wrap:pretty\">The offerings this question presents as answer options. For a Section, this is the union of offerings across its questions.<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:flex;align-items:center;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;flex:1\">Offering<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ catAssocOfferings }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <span style=\"flex:1;font-size:12.5px;font-weight:500\">{{ o.name }}<\ 02Fsc-if>\n\n          <!-- LIFECYCLE -->\n          <sc-if value=\"{{ offViewLifecycle }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #E0E0E0\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;font-weight:600\">Offering Lifecycle<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#5F6368;margin-top:3px\">Define the stages an offering moves through from creation to retirement.<\u002Fdiv>\n                <\u002Fdiv>\n                <button style=\"height:32px;padding:0 13px;border:none;background:#1565C0;border-radius:4px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer\">+ Add Stage<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:22px 20px\">\n                <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:14px\">Lifecycle pipeline<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:6px\">\n                  <sc-for list=\"{{ offLifecycle }}\" as=\"st\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex;align-items:center;gap:8px;flex-shrink:0\">\n                      <div style=\"{{ st.boxStyle }}\">\n                        <div style=\"font-size:12.5px;font-weight:600\">{{ st.name }}<\u002Fdiv>\n                        <div style=\"font-size:11px;color:#9AA0A6;margin-top:3px\">{{ st.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ st.arrow }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"color:#C6CBD4;font-size:12px\">→<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin:26px 0 10px\">Stage transition rules<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr 2fr 1fr 60px;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">From<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">To<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Condition<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Requires approval<\u002Fdiv>\n                    <div><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ offTransitions }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:1fr 1fr 2fr 1fr 60px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div><span style=\"{{ t.fromStyle }}\">{{ t.from }}<\u002Fspan><\u002Fdiv>\n                      <div><span style=\"{{ t.toStyle }}\">{{ t.to }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ t.condition }}<\u002Fdiv>\n                      <div><span style=\"{{ t.approvalStyle }}\">{{ t.approval }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size:12px;color:#1565C0;cursor:pointer\">Edit<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- SCOPING y:grid;grid-template-columns:1.4fr 1.2fr 1fr 1.4fr .9fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ sc.rule }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ sc.audience }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ sc.region }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ sc.applies }}<\u002Fdiv>\n                      <div><span style=\"{{ sc.stateStyle }}\">{{ sc.state }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;background:#F9FBFD;border:1px solid #E3E9F0;border-radius:6px;padding:12px 14px;font-size:12px;color:#5F6368;line-height:1.6\">Repository scoping is the ceiling — a catalog or category can narrow who sees an offering, never widen it.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- APPROVAL WORKFLOWS -->\n          <sc-if value=\"{{ offViewApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #E0E0E0\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;font-weight:600\">Approval Workflows<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#5F6368;margin-top:3px\">Configure multi-stage approval flows for offering creation and lifecycle transitions.<\u002Fdiv>\n                <\u002Fdiv>\n                <button style=\"height:32px;padding:0 13px;border:none;background:#1565C0;border-radius:4px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer\">+ New Workflow<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px\">\n                <div s \u002Fsc-for>\n                        <div style=\"display:flex;justify-content:flex-end\">\n                          <button style=\"height:32px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer;height:28px\">Edit workflow<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"border:2px dashed #E0E0E0;border-radius:8px;padding:20px;text-align:center;color:#9AA0A6;cursor:pointer\">\n                  <div style=\"font-size:20px\">+<\u002Fdiv>\n                  <div style=\"font-size:13px;font-weight:500;color:#5F6368;margin-top:4px\">New approval workflow<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- SYNC ACTIONS -->\n          <sc-if value=\"{{ offViewSync }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #E0E0E0;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:15px;font-weight:600\">Sync Actions<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#5F6368;margin-top:3px\">The repository is the source of truth. Push offering changes to the consuming modules.<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ offRecheck }}\" style=\"height:32px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer\">Re-check targets<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ offSyncAll }}\" style=\"height:32px;padding:0 13px;border:none;background:#1565C0;border-radius:4px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer\">Sync all pending<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px\">\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px\">\n                  <sc-for list=\"{{ offSyncTargets }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <div style=\"border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                      <div style=\"display:flex;align-items:center;gap:8px\">\n                        <div style=\"font-size:13px;font-weight:600;flex:1\">{{ t.name }}<\u002Fdiv>\n                        <span style=\"{{ t.stateStyle }}\">{{ t.state }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12px;color:#5F6368;margin-top:8px;line-height:1.5\">{{ t.detail }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#9AA0A6;margin-top:6px\">Last sync {{ t.lastSync }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368;margin-bottom:8px\">Offering sync status<\u002Fdiv>\n                <div style=\"border:1px solid #E0E0E0;border-radius:6px;overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:1.6fr 1.4fr 1fr 1.1fr 1fr .8fr;gap:10px;padding:9px 14px;background:#F9FAFC;border-bottom:1px solid #E0E0E0\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Offering<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Service<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Lifecycle<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Sync state<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">Last synced<\u002Fdiv>\n                    <div><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ offSyncRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                    <div style=\"display:grid;grid-template-columns:1.6fr 1.4fr 1fr 1.1fr 1fr .8fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #F0F1F5\">\n                      <div style=\"font-size:12.5px;font-weight:500\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ r.service }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ r.lifecycle }}<\u002Fdiv>\n                      <div><span style=\"{{ r.syncStyle }}\">{{ r.sync }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#5F6368\">{{ r.lastSynced }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#1565C0;cursor:pointer\">{{ r.action }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ANALYTICS -->\n          <sc-if value=\"{{ offViewAnalytics }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:18px 20px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;font-weight:600\">Offering Analytics<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#5F6368;margin-top:3px\">Usage trends, request volumes and SLA compliance across all offerings.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-raw-select style=\"height:32px;border:1px solid #E0E0E0;border-radius:4px;font-size:12.5px;padding:0 8px;background:#fff\">\n                  <option>Last 90 days<\u002Foption>\n                  <option>Last 30 days<\u002Foption>\n                  <option>This quarter<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px\">\n                <sc-for list=\"{{ offAnalyticsStats }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <div style=\"border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                    <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6368\">{{ a.label }}<\u002Fdiv>\n                    <div style=\"{{ a.valueStyle }}\">{{ a.value }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#9AA0A6;margin-top:5px\">{{ a.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:320px;border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                  <div style=\"font-size:13px;font-weight:600;margin-bottom:12px\">Most requested offerings<\u002Fdiv>\n                  <sc-for list=\"{{ offTopOfferings }}\" as=\"t\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;gap:12px;padding:7px 0\">\n                      <div style=\"width:170px;flex-shrink:0;font-size:12.5px\">{{ t.name }}<\u002Fdiv>\n                      <div style=\"flex:1;height:8px;border-radius:4px;background:#F0F1F5\">\n                        <div style=\"{{ t.barStyle }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"width:52px;text-align:right;font-size:12px;color:#5F6368\">{{ t.count }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:300px;border:1px solid #E0E0E0;border-radius:6px;padding:14px 16px\">\n                  <div style=\"font-size:13px;font-weight:600;margin-bottom:12px\">SLA compliance by category<\u002Fdiv>\n                  <sc-for list=\"{{ offSlaRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F0F1F5\">\n                      <span style=\"flex:1;font-size:12.5px;color:#5F6368\">{{ r.label }}<\u002Fspan>\n                      <span style=\"{{ r.badgeStyle }}\">{{ r.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- OFFERING DETAIL -->\n          <sc-if value=\"{{ offViewDetail }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #E0E0E0\">\n                <div sc-camel-on-click=\"{{ offBack }}\" style=\"width:28px;height:28px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#5F6368;cursor:pointer\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:13px;height:13px\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;color:#5F6368\">All Offerings<\u002Fspan>\n                <div style=\"flex:1\"><\u002Fdiv>\n<button sc-camel-on-click=\"{{ noffOpenEditOffering }}\" style=\"height:32px;padding:0 12px;border:1px solid #E0E0E0;background:#fff;border-radius:4px;font-size:12.5px;color:#1A1A1A;cursor:pointer;height:28px\">Edit<\u002Fbutton>\n
